<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>历史记录 - 赛博秘书</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #16161a;
            color: white;
            font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
        }
        .container { width: 100%; min-height: 100vh; display: flex; flex-direction: column; }
        .header {
            padding: 18px 20px;
            background: rgba(28,28,34,0.9);
            border-bottom: 1px solid rgba(255,255,255,0.07);
            position: sticky; top: 0; z-index: 10;
        }
        .header h1 { font-size: 18px; margin-bottom: 12px; }
        .filter-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        .filter-group { display: flex; flex-wrap: wrap; gap: 6px; margin-right: 12px; }
        .filter-group .label { font-size: 11px; color: rgba(255,255,255,0.4); align-self: center; margin-right: 2px; }
        .chip {
            padding: 5px 12px;
            background: rgba(255,255,255,0.07);
            color: rgba(255,255,255,0.7);
            border: none; border-radius: 16px;
            cursor: pointer; font-size: 12px; transition: all 0.2s;
        }
        .chip:hover { background: rgba(255,255,255,0.14); }
        .chip.active { background: rgba(120,180,255,0.3); color: white; }

        .content { flex: 1; padding: 18px 20px; }
        .entries-list { display: flex; flex-direction: column; gap: 12px; }
        .entry-card {
            background: rgba(28,28,34,0.85);
            border-radius: 12px; padding: 14px 16px;
            border-left: 3px solid #555;
            transition: all 0.2s;
        }
        .entry-card:hover { background: rgba(40,40,48,0.9); }
        .entry-card.overdue { border-left-color: #e5484d; }
        .entry-card.today { border-left-color: #ff8c42; }
        .entry-card.done { border-left-color: #4caf50; opacity: 0.65; }
        .entry-card.note { border-left-color: #888; }

        .entry-title { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
        .entry-content { font-size: 13px; color: rgba(255,255,255,0.85); line-height: 1.5; margin-bottom: 8px; }
        .entry-meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: 11px; color: rgba(255,255,255,0.5); align-items: center; margin-bottom: 10px; }
        .entry-meta .due { color: #ff8c42; }
        .entry-meta .due.overdue { color: #e5484d; }
        .entry-meta .cat { padding: 2px 8px; border-radius: 10px; background: rgba(255,255,255,0.1); }
        .entry-meta .priority-high { color: #e5484d; }
        .entry-meta .tag { color: rgba(120,180,255,0.85); }

        .entry-actions { display: flex; gap: 8px; }
        .action-button {
            padding: 5px 12px;
            background: rgba(255,255,255,0.09);
            color: rgba(255,255,255,0.85);
            border: none; border-radius: 6px;
            cursor: pointer; font-size: 11px; transition: all 0.2s;
        }
        .action-button:hover { background: rgba(255,255,255,0.18); }
        .action-button.done { background: rgba(80,200,120,0.2); }
        .action-button.done:hover { background: rgba(80,200,120,0.35); }
        .action-button.delete { background: rgba(255,90,90,0.2); }
        .action-button.delete:hover { background: rgba(255,90,90,0.35); }
        .action-button.due-edit { background: rgba(255,180,80,0.18); }

        .due-edit-row { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
        .due-edit-row input[type="date"] {
            background: rgba(255,255,255,0.1); color: white;
            border: none; border-radius: 6px; padding: 5px 8px; font-size: 12px;
            color-scheme: dark;
        }
        .due-edit-row button {
            padding: 4px 10px; background: rgba(120,180,255,0.25); color: white;
            border: none; border-radius: 6px; font-size: 11px; cursor: pointer;
        }

        .empty-state { text-align: center; color: rgba(255,255,255,0.3); padding: 50px 0; font-size: 14px; }
        .count-line { font-size: 11px; color: rgba(255,255,255,0.4); margin-bottom: 10px; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>历史记录</h1>
            <div class="filter-row">
                <div class="filter-group">
                    <span class="label">状态</span>
                    <button class="chip active" data-filter="status" data-value="all">全部</button>
                    <button class="chip" data-filter="status" data-value="pending">待办</button>
                    <button class="chip" data-filter="status" data-value="done">已完成</button>
                </div>
                <div class="filter-group" id="category-group">
                    <span class="label">分类</span>
                    <button class="chip active" data-filter="category" data-value="all">全部</button>
                </div>
                <div class="filter-group" id="tag-group">
                    <span class="label">标签</span>
                    <button class="chip active" data-filter="tag" data-value="all">全部</button>
                </div>
            </div>
        </div>
        <div class="content">
            <div class="count-line" id="count-line"></div>
            <div class="entries-list" id="entries-list"></div>
        </div>
    </div>

    <script>
        const api = window.api;
        let allEntries = [];
        const filters = { status: 'all', category: 'all', tag: 'all' };

        function loadEntries() { api.getEntries(); }

        api.onEntries((entries) => {
            allEntries = (entries || []).sort((a, b) => new Date(b.created) - new Date(a.created));
            renderChips();
            renderEntries();
        });

        // 渲染筛选 chips
        function renderChips() {
            // 分类
            const catGroup = document.getElementById('category-group');
            const cats = Array.from(new Set(allEntries.map((e) => e.category).filter(Boolean)));
            catGroup.innerHTML = '<span class="label">分类</span><button class="chip active" data-filter="category" data-value="all">全部</button>';
            cats.forEach((c) => {
                const btn = document.createElement('button');
                btn.className = 'chip' + (filters.category === c ? ' active' : '');
                btn.dataset.filter = 'category'; btn.dataset.value = c;
                btn.textContent = c;
                catGroup.appendChild(btn);
            });
            // 标签
            const tagGroup = document.getElementById('tag-group');
            const tags = Array.from(new Set(allEntries.flatMap((e) => e.tags || []))).slice(0, 15);
            tagGroup.innerHTML = '<span class="label">标签</span><button class="chip active" data-filter="tag" data-value="all">全部</button>';
            tags.forEach((t) => {
                const btn = document.createElement('button');
                btn.className = 'chip' + (filters.tag === t ? ' active' : '');
                btn.dataset.filter = 'tag'; btn.dataset.value = t;
                btn.textContent = '#' + t;
                tagGroup.appendChild(btn);
            });

            // 恢复所有 chip 的激活态（含静态的"全部/待办/已完成"）
            document.querySelectorAll('.chip').forEach((chip) => {
                const f = chip.dataset.filter;
                const v = chip.dataset.value;
                chip.classList.toggle('active', filters[f] === v);
            });
        }

        // 事件委托：在 filter-row 上绑定一次，动态/静态 chips 都生效
        document.querySelector('.filter-row').addEventListener('click', (e) => {
            const chip = e.target.closest('.chip');
            if (!chip) return;
            const f = chip.dataset.filter;
            const v = chip.dataset.value;
            filters[f] = v;
            document.querySelectorAll(`.chip[data-filter="${f}"]`).forEach((c) => c.classList.remove('active'));
            chip.classList.add('active');
            renderEntries();
        });

        function renderEntries() {
            const list = document.getElementById('entries-list');
            let filtered = allEntries;
            if (filters.status === 'pending') filtered = filtered.filter((e) => e.status === 'pending');
            if (filters.status === 'done') filtered = filtered.filter((e) => e.status === 'done');
            if (filters.category !== 'all') filtered = filtered.filter((e) => e.category === filters.category);
            if (filters.tag !== 'all') filtered = filtered.filter((e) => (e.tags || []).includes(filters.tag));

            document.getElementById('count-line').textContent = `共 ${filtered.length} 条记录`;

            if (!filtered.length) {
                list.innerHTML = '<div class="empty-state">暂无记录</div>';
                return;
            }
            const today = new Date().toISOString().slice(0, 10);
            list.innerHTML = filtered.map((e) => {
                const overdue = e.status === 'pending' && e.dueDate && e.dueDate < today;
                const todayDue = e.status === 'pending' && e.dueDate === today;
                const cls = e.status === 'done' ? 'done' : overdue ? 'overdue' : todayDue ? 'today' : e.dueDate ? '' : 'note';
                const dueText = e.dueDate
                    ? (overdue ? '已逾期 ' + e.dueDate : todayDue ? '今天截止' : '截止 ' + e.dueDate)
                    : '';
                return `<div class="entry-card ${cls}" data-id="${e.id}">
                    <div class="entry-title">${esc(e.title || '(无标题)')}</div>
                    <div class="entry-content">${esc(e.content)}</div>
                    <div class="entry-meta">
                        ${dueText ? `<span class="due ${overdue ? 'overdue' : ''}">⏰ ${esc(dueText)}</span>` : ''}
                        ${e.priority === '高' ? '<span class="priority-high">🔥 高</span>' : e.priority === '中' ? '<span>中</span>' : ''}
                        ${e.category ? `<span class="cat">${esc(e.category)}</span>` : ''}
                        ${(e.tags || []).map((t) => `<span class="tag">#${esc(t)}</span>`).join('')}
                        <span>${esc(formatTime(e.created))}</span>
                        ${e.status === 'pending' ? '<span style="color:#ff8c42">待办</span>' : e.status === 'done' ? '<span style="color:#4caf50">已完成</span>' : '<span>备忘</span>'}
                    </div>
                    <div class="entry-actions">
                        ${e.status === 'pending'
                            ? '<button class="action-button done" onclick="markDone(\'' + e.id + '\', true)">✓ 完成</button>'
                            : e.status === 'done'
                                ? '<button class="action-button" onclick="markDone(\'' + e.id + '\', false)">↩ 恢复</button>'
                                : ''}
                        <button class="action-button due-edit" onclick="toggleDueEdit('${e.id}')">改期</button>
                        <button class="action-button" onclick="copyContent('${e.id}')">复制</button>
                        <button class="action-button delete" onclick="deleteEntry('${e.id}')">删除</button>
                    </div>
                </div>`;
            }).join('');
        }

        // 改期（内联编辑）
        let dueEditRow = null;
        function toggleDueEdit(id) {
            const entry = allEntries.find((e) => e.id === id);
            if (!entry) return;
            if (dueEditRow) dueEditRow.remove();
            const card = document.querySelector(`.entry-card[data-id="${id}"]`);
            if (!card) return;
            const row = document.createElement('div');
            row.className = 'due-edit-row';
            const input = document.createElement('input');
            input.type = 'date';
            input.value = entry.dueDate || '';
            const saveBtn = document.createElement('button');
            saveBtn.textContent = '确定';
            saveBtn.addEventListener('click', () => {
                api.updateDueDate(id, input.value || null);
                dueEditRow = null;
                setTimeout(loadEntries, 200);
            });
            const cancelBtn = document.createElement('button');
            cancelBtn.textContent = '取消';
            cancelBtn.addEventListener('click', () => { row.remove(); dueEditRow = null; });
            row.appendChild(input); row.appendChild(saveBtn); row.appendChild(cancelBtn);
            card.appendChild(row);
            dueEditRow = row;
        }

        function markDone(id, done) { api.markDone(id, done); setTimeout(loadEntries, 200); }
        function copyContent(id) {
            const entry = allEntries.find((e) => e.id === id);
            if (!entry) return;
            navigator.clipboard.writeText(entry.content || entry.title || '').then(() => {
                showToast('已复制到剪贴板');
            });
        }
        function deleteEntry(id) {
            if (confirm('确定删除这条记录？')) { api.deleteEntry(id); setTimeout(loadEntries, 200); }
        }

        function esc(str) {
            return String(str || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
        function formatTime(iso) {
            const d = new Date(iso), now = new Date();
            const diff = now - d;
            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
            if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
            if (diff < 7 * 86400000) return Math.floor(diff / 86400000) + '天前';
            return d.toLocaleDateString();
        }

        // 轻量 toast
        function showToast(msg) {
            let t = document.getElementById('toast');
            if (!t) {
                t = document.createElement('div');
                t.id = 'toast';
                t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(40,40,48,0.95);color:white;padding:8px 18px;border-radius:8px;font-size:13px;z-index:999;transition:opacity 0.3s;';
                document.body.appendChild(t);
            }
            t.textContent = msg;
            t.style.opacity = '1';
            clearTimeout(t._timer);
            t._timer = setTimeout(() => { t.style.opacity = '0'; }, 1600);
        }

        api.onEntryUpdated(() => setTimeout(loadEntries, 200));
        api.onDeleteSuccess(() => setTimeout(loadEntries, 200));

        loadEntries();
    </script>
</body>
</html>
