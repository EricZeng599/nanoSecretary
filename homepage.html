<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 内容安全策略：仅本机脚本；样式允许内联（无构建工具链） -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
    <title>nanoSecretary</title>
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="date-picker-react.css">
    <link rel="stylesheet" href="date-picker.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: transparent;
            color: var(--text-strong);
            font-family: var(--font-stack);
            font-size: var(--text-body);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* 表单控件会继承 UA 的 button/input font 简写（默认 Arial），
           必须显式归位到 --font-stack，否则按钮中文落到无衬线（Arial → YaHei），
           与正文宋体断层。像素字体在 tokens.css 的清单里按选择器覆盖单项。 */
        button, input, select, textarea {
            font-family: var(--font-stack);
        }
        /* 无障碍：键盘焦点指示 —— 3px 橙 + 2px 留白（lshu 合同） */
        :focus-visible {
            outline: 3px solid var(--action-focus);
            outline-offset: 2px;
            border-radius: 0;
        }
        /* 统一线性图标 */
        .icon { display: inline-block; vertical-align: -2px; }
        .icon.inline { margin-right: 5px; }

        /* ===== 一级容器：白底 2px 主色框，无圆角无阴影 ===== */
        .container {
            flex: 1;
            background: var(--surface-main);
            border: 2px solid var(--border-strong);
            border-radius: 0;
            margin: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: none;
            overflow: hidden;
        }
        .header {
            display: flex; align-items: center; justify-content: space-between;
            gap: 10px; margin-bottom: 14px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border-strong);
        }
        .header h1 {
            font-family: var(--font-display);
            font-size: var(--px-size-2x);
            font-weight: 400;
            letter-spacing: 0;
            color: var(--text-strong);
            line-height: 1.2;
            display: flex; align-items: center;
        }
        /* 模块编号：lshu 的版式签名。橙底主色字，是唯一允许的橙底用法 */
        .mod-code {
            display: inline-block;
            background: var(--action-primary);
            color: var(--action-on-text);
            font-family: var(--font-display);
            font-size: var(--px-size);
            line-height: 1.5;
            padding: 0 6px;
            margin-right: 8px;
            flex-shrink: 0;
        }
        .header .ai-status {
            font-size: var(--px-size); color: var(--text-tertiary);
            padding: 3px 8px;
            border: 1px solid var(--border-subtle);
            background: transparent;
            max-width: 46%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
            cursor: default;
            display: inline-flex; align-items: center; gap: 6px;
        }
        /* 状态不只靠颜色：始终带一个方块指示点 + 文字 */
        .header .ai-status::before {
            content: ''; width: 6px; height: 6px; flex-shrink: 0;
            background: currentColor; display: block;
        }
        .header .ai-status.online {
            color: var(--status-ai-online);
            border-color: var(--border-strong);
            background: var(--status-success-bg);
        }
        .header .ai-status.offline { color: var(--text-tertiary); }
        /* 服务可达、但没有能对话的模型：既不是「在线」（问了没回应），
           也不是「离线」（服务明明在跑）。用「提醒」色与两者区分 ——
           同一对色（--text-strong / --status-warning-bg）在历史页徽标上已审计过。 */
        .header .ai-status.warn {
            color: var(--text-strong);
            border-color: var(--px-mark);
            background: var(--status-warning-bg);
        }
        /* 「连接中」给出轻微处理指示（脉冲点），区别于卡住无反馈 */
        .header .ai-status.loading { color: var(--text-tertiary); }
        .header .ai-status.loading::before { animation: ai-pulse 1.2s steps(2, end) infinite; }
        @keyframes ai-pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }

        /* ===== 顶部 Tab：一条分段控制，不是三枚漂浮胶囊 ===== */
        .tabs {
            display: flex; gap: 0; margin-bottom: 14px;
            border: 2px solid var(--border-strong);
        }
        .tab {
            flex: 1;
            padding: 9px 0;
            font-size: var(--px-size);
            border: none;
            border-right: 1px solid var(--border-strong);
            background: var(--surface-tab);
            color: var(--text-secondary);
            cursor: pointer;
            transition: background var(--dur-fast), color var(--dur-fast);
        }
        .tab:last-child { border-right: none; }
        .tab:hover { background: var(--button-secondary-hover); color: var(--ink-on-bright); }
        .tab.active { background: var(--action-primary); color: var(--action-on-text); }
        .tab .count { color: var(--text-faint); font-size: var(--px-size); margin-left: 4px; }
        .tab.active .count { color: var(--action-on-text); }

        /* ===== 仪表盘视图（bento） ===== */
        #view-dashboard {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            gap: 12px;
        }
        /* 上排：关注卡做主角，今日/本周小卡让位 */
        .dash-row { display: flex; gap: 12px; }
        .dash-card {
            min-width: 0;
            background: var(--surface-card);
            border: 1px solid var(--border-strong);
            border-radius: 0;
            padding: 12px 12px 12px;
            display: flex;
            flex-direction: column;
            box-shadow: none;
            transition: border-color var(--dur-fast);
        }
        /* 关注卡 = 主卡（flex: 1.2），环更大更醒目 */
        .dash-card.attention { flex: 1.2; }
        /* 右侧列：今日 + 本周 垂直堆叠 */
        .dash-col { flex: 1; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
        .dash-col .dash-card { flex: 1; }
        .dash-card.clickable { cursor: pointer; }
        .dash-card.clickable:hover { border-color: var(--action-primary); }
        /* 卡片标题行 = 模块编号 + 名称 + 计数，底部 1px 分隔线 */
        .dash-card .card-label {
            font-size: var(--px-size);
            color: var(--text-tertiary);
            letter-spacing: 0.04em;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex; align-items: center; gap: 6px;
        }
        .dash-card .card-label .icon { width: 12px; height: 12px; }
        .dash-card .card-label .mod-code { margin-right: 2px; line-height: 1.4; }
        /* 环区 */
        .ring-wrap {
            position: relative;
            margin: 0 auto 10px;
        }
        .ring-wrap svg { display: block; }
        .ring-center {
            position: absolute; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            pointer-events: none;
        }
        .ring-center .big {
            font-family: var(--font-display);
            font-size: var(--px-size-2x);
            font-weight: 400;
            line-height: 1;
            color: var(--text-strong);
            letter-spacing: 0;
        }
        .ring-center .big small { font-size: var(--px-size); }
        .ring-center .sub {
            font-size: var(--px-size);
            color: var(--text-tertiary);
            margin-top: 4px;
        }
        /* 主卡（关注）中心数字更大 —— 唯一主导元素，跳到 3× 网格 */
        .dash-card.attention .ring-center .big { font-size: var(--px-size-3x); }
        .dash-card.attention .ring-wrap { width: 124px; height: 124px; }
        /* 侧卡（今日）中心数字缩小，与主卡拉开层级 */
        .dash-card.side .ring-center .big { font-size: var(--px-size-2x); }
        .dash-card.side .ring-wrap { width: 84px; height: 84px; }
        /* 本周侧卡：去环，压实成一行进度 */
        .week-block {
            margin-top: 4px;
            display: flex; align-items: center; gap: 8px;
            font-size: var(--px-size); color: var(--text-tertiary);
        }
        .week-block .bar {
            flex: 1; height: 6px; border-radius: 0;
            background: var(--chart-track); overflow: hidden;
        }
        .week-block .bar > i {
            display: block; height: 100%;
            background: var(--action-primary); border-radius: 0;
            transition: width var(--dur-slow) steps(6, end);
        }
        /* 环下注释行 */
        .dash-foot {
            text-align: center;
            font-size: var(--text-meta);
            color: var(--text-tertiary);
            margin-top: auto;
            padding-top: 8px;
            line-height: 1.5;
        }
        .dash-foot .hl { color: var(--text-strong); font-weight: var(--weight-strong); }
        /* 图例行 */
        .legend {
            display: flex; flex-direction: column;
            gap: 4px; margin-top: 6px;
            font-size: var(--px-size);
            color: var(--text-secondary);
        }
        .legend .row { display: flex; align-items: center; gap: 6px; }
        .legend .swatch { width: 8px; height: 8px; border-radius: 0; flex-shrink: 0; }
        /* 无日期项在环上与「远期」共用同一弱段色；swatch 用空框区分，示意「无日期=空、共享弱段」而非新色相段 */
        .legend .swatch.undated {
            background: transparent; border: 1px solid var(--border-soft); box-sizing: border-box;
        }
        .legend .row .n { margin-left: auto; color: var(--text-strong); font-family: var(--font-display); }
        /* 「近7天完成」是独立「已完成」轴，不是环段：无 swatch，加分隔线与环段轴明确分离 */
        .legend .done-note { margin-left: 14px; }
        /* 待处理(环)与已完成(计数)两条轴之间的可见分隔线，避免「近7天完成」被误读为第 5 个环段 */
        .legend .axis-divider {
            height: 1px; background: var(--border-subtle);
            margin: 3px 0 2px;
        }
        /* 今日副行（下一件） */
        .next-todo {
            display: flex; align-items: center; gap: 6px;
            font-size: var(--text-meta); color: var(--text-secondary);
            margin-top: 8px; padding-top: 8px;
            border-top: 1px solid var(--border-subtle);
            cursor: pointer;
        }
        .next-todo .lbl { flex-shrink: 0; color: var(--text-faint); }
        .next-todo:hover .hl { color: var(--action-primary); }
        .next-todo .hl {
            overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
            color: var(--text-strong); font-weight: var(--weight-strong);
        }
        /* 底部：tag 格 */
        .dash-tags {
            background: var(--surface-card);
            border: 1px solid var(--border-strong);
            border-radius: 0;
            padding: 12px;
            box-shadow: none;
        }
        .dash-tags .tags-label {
            font-size: var(--px-size); color: var(--text-tertiary);
            letter-spacing: 0.04em; margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-subtle);
        }
        .tag-chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .tag-chip {
            padding: 4px 10px;
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-strong);
            border-radius: 0;
            cursor: pointer; font-size: var(--px-size);
            transition: background var(--dur-fast), color var(--dur-fast);
            display: inline-flex; align-items: center; gap: 4px;
        }
        .tag-chip:hover { background: var(--button-secondary-hover); color: var(--ink-on-bright); }
        .tag-chip.active { background: var(--surface-active); border-color: var(--action-primary); color: var(--action-on-text); }
        .tag-chip.active .cnt { color: var(--action-on-text); }
        .tag-chip .cnt { color: var(--text-faint); font-family: var(--font-display); font-size: var(--px-size); }
        /* 展开其余标签（distill：默认只露 Top-3，点开再看剩余） */
        .tag-reveal {
            margin-top: 8px;
            background: transparent; color: var(--text-secondary);
            border: 1px solid var(--border-strong); border-radius: 0;
            padding: 4px 10px; font-size: var(--px-size); cursor: pointer;
            display: inline-flex; align-items: center; gap: 4px;
        }
        .tag-reveal:hover { background: var(--button-secondary-hover); color: var(--ink-on-bright); }
        .dash-tags .tag-detail {
            margin-top: 10px; padding-top: 8px;
            border-top: 1px solid var(--border-subtle);
            font-size: var(--text-meta); color: var(--text-secondary);
            display: flex; align-items: center; justify-content: space-between;
            cursor: pointer; transition: color var(--dur-fast);
        }
        .dash-tags .tag-detail:hover { color: var(--text-strong); }
        .dash-tags .tag-detail:hover .big { color: var(--action-primary); }
        .dash-tags .tag-detail .big {
            font-family: var(--font-display); font-size: var(--px-size-2x); color: var(--text-strong);
        }
        .dash-empty {
            text-align: center; color: var(--text-tertiary);
            padding: 40px 0; font-size: var(--text-body);
            grid-column: 1 / -1;
        }

        /* 记录 Tab */
        #view-records {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0; /* 允许内部滚动 */
        }
        .input-section { margin-bottom: 10px; flex-shrink: 0; }
        .input-section textarea {
            width: 100%; height: 70px;
            background: var(--surface-field);
            border: 1px solid var(--border-strong);
            border-radius: 0;
            color: var(--text-primary); padding: 10px 12px;
            font-size: var(--text-body); resize: none;
            font-family: inherit;
            transition: border-color var(--dur-fast);
        }
        .input-section textarea::placeholder { color: var(--text-faint); }
        .input-section textarea:focus { border-color: var(--border-field); }
        .input-section .save-row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
        /* 主 CTA：橙底主色字 + 2px 硬边影，同视图唯一视觉主按钮 */
        .save-btn {
            padding: 8px 18px;
            background: var(--action-primary);
            color: var(--action-on-text);
            border: 2px solid var(--action-primary);
            border-radius: 0;
            box-shadow: var(--shadow-action);
            cursor: pointer; font-size: var(--px-size);
            transition: transform var(--dur-fast);
        }
        .save-btn:hover { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--px-line); }
        .save-btn:active { transform: translate(2px, 2px); box-shadow: none; }
        #ai-preview-box {
            margin-top: 8px; padding: 8px 10px;
            background: var(--status-warning-bg); border: 1px solid var(--px-mark);
            border-radius: 0; font-size: var(--text-meta); display: none;
            color: var(--text-primary);
        }

        /* 待办列表 */
        .list-section { flex: 1; min-height: 0; overflow-y: auto; }
        /* 待办 tag 筛选条（从仪表盘 tag 芯片进入，action-first） */
        /* 用 :not([hidden]) 门控 display:flex，避免作者样式覆盖 UA 的 [hidden]{display:none}，
           否则清除筛选/跳转后 .filter-bar 会残留一条"幽灵筛选栏"（状态与事实不符）。 */
        .filter-bar:not([hidden]) {
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            margin: 0 0 8px; padding: 6px 10px;
            background: var(--status-warning-bg);
            border: 1px solid var(--px-mark);
            border-radius: 0;
            font-size: var(--text-meta); color: var(--text-primary);
        }
        .filter-bar .filter-tag { color: var(--text-strong); font-weight: var(--weight-strong); }
        .filter-clear {
            background: transparent; color: var(--text-secondary);
            border: 1px solid var(--border-strong); padding: 3px 10px; border-radius: 0;
            font-size: var(--px-size); cursor: pointer;
        }
        .filter-clear:hover { background: var(--button-secondary-hover); color: var(--ink-on-bright); }
        .list-section h2 {
            font-size: var(--px-size); color: var(--text-tertiary);
            margin: 6px 0 4px; font-weight: 400;
            letter-spacing: 0.06em;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-subtle);
        }
        /* ===== 数据行（替代卡片 + 左色条） =====
           左条留给交互：hover 黄、高亮橙。状态本身改由 entry-meta 里的
           色底徽标承载（橙/黄不做小字，只做底）。 */
        .entry-list { display: flex; flex-direction: column; }
        .entry-item {
            background: transparent;
            border-radius: 0; padding: 10px 12px;
            border-left: 4px solid transparent;
            border-bottom: 1px solid var(--border-subtle);
            transition: border-color var(--dur-fast), background var(--dur-fast);
        }
        .entry-item:hover { border-left-color: var(--px-mark); }
        .entry-item.done { opacity: 0.62; }
        .entry-item.flash {
            border-left-color: var(--action-primary);
            animation: entry-flash 1.4s steps(4, end);
        }
        @keyframes entry-flash {
            0%, 60% { background: var(--status-warning-bg); }
            100% { background: transparent; }
        }
        .entry-title { font-size: var(--text-body); margin-bottom: 5px; font-weight: var(--weight-strong); color: var(--text-strong); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .entry-item.done .entry-title { text-decoration: line-through; }
        .entry-meta { display: flex; gap: 6px; font-size: var(--text-meta); color: var(--text-tertiary); align-items: center; flex-wrap: wrap; }
        /* 状态一律「色底 + 主色字」徽标，绝不做橙/黄小字（对比度不足） */
        .entry-meta .due {
            background: var(--status-warning-bg);
            border: 1px solid var(--px-mark);
            color: var(--text-strong);
            padding: 0 6px;
            font-size: var(--px-size);
            line-height: 1.6;
        }
        .entry-meta .due.overdue {
            background: var(--action-primary);
            border-color: var(--action-primary);
            color: var(--action-on-text);
        }
        .entry-meta .priority-high {
            background: var(--action-primary);
            border: 1px solid var(--action-primary);
            color: var(--action-on-text);
            padding: 0 6px; font-size: var(--px-size); line-height: 1.6;
        }
        .entry-meta .priority-mid {
            background: var(--status-warning-bg);
            border: 1px solid var(--px-mark);
            color: var(--text-strong);
            padding: 0 6px; font-size: var(--px-size); line-height: 1.6;
        }
        .entry-meta .priority-low {
            border: 1px solid var(--border-subtle);
            color: var(--text-tertiary);
            padding: 0 6px; font-size: var(--px-size); line-height: 1.6;
        }
        .entry-meta .cat {
            padding: 0 6px; border-radius: 0; border: 1px solid var(--border-strong);
            background: transparent; color: var(--text-secondary);
            font-size: var(--px-size); line-height: 1.6;
        }
        .entry-actions { margin-top: 8px; display: flex; gap: 6px; }
        .entry-actions button {
            background: transparent; color: var(--text-secondary);
            border: 1px solid var(--border-strong); padding: 4px 10px; border-radius: 0;
            font-size: var(--px-size); cursor: pointer;
            transition: background var(--dur-fast), color var(--dur-fast);
        }
        .entry-actions button:hover { background: var(--button-secondary-hover); color: var(--ink-on-bright); }
        .entry-actions .done-btn:hover { background: var(--status-success-bg); border-color: var(--border-strong); }
        .entry-actions .promote-btn { color: var(--text-strong); }
        .entry-actions .promote-btn:hover { background: var(--status-success-bg); border-color: var(--border-strong); }
        .empty { text-align: center; color: var(--text-tertiary); padding: 30px 0; font-size: var(--text-body); }

        /* 改期行（复用历史页 due-edit-row 视觉） */
        .due-edit-row { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
        .due-edit-row > .nsdp-mount { flex: 1; min-width: 0; display: flex; }
        .due-edit-row > .nsdp-mount .nsdp-field-wrap { width: 100%; }
        .due-edit-row > button {
            padding: 4px 10px; background: var(--action-primary); color: var(--action-on-text);
            border: 1px solid var(--action-primary); border-radius: 0; font-size: var(--px-size); cursor: pointer;
            white-space: nowrap;
        }
        .due-edit-row > button:last-child { background: transparent; color: var(--text-secondary); border: 1px solid var(--border-strong); }

        /* 删除确认条（内联） */
        .confirm-bar {
            margin-top: 6px; display: flex; gap: 8px; align-items: center;
            font-size: var(--text-meta); color: var(--text-secondary);
        }
        .confirm-bar .confirm-btns { display: flex; gap: 6px; }
        /* 危险动作：橙底主色字（删除按钮是唯一拿到实底橙的次级动作） */
        .confirm-bar button {
            background: var(--action-primary); color: var(--action-on-text);
            border: 1px solid var(--action-primary); padding: 4px 10px; border-radius: 0;
            font-size: var(--px-size); cursor: pointer;
        }
        .confirm-bar button.confirm-no { background: transparent; color: var(--text-secondary); border: 1px solid var(--border-strong); }

        /* 轻量 toast（保存/删除等反馈，底部浮出） */
        .toast {
            position: fixed; bottom: 18px; left: 50%;
            transform: translateX(-50%) translateY(8px);
            background: var(--surface-raised); color: var(--text-strong);
            border: 2px solid var(--border-strong); border-radius: 0;
            padding: 8px 14px; font-size: var(--text-meta);
            box-shadow: none;
            opacity: 0; pointer-events: none;
            transition: opacity var(--dur-med), transform var(--dur-med);
            z-index: 30; max-width: 90%; white-space: nowrap;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast .toast-undo {
            margin-left: 12px; color: var(--text-strong); font-weight: var(--weight-strong);
            background: none; border: none; cursor: pointer; font-size: var(--text-meta);
            padding: 0; text-decoration: underline;
        }
        .toast .toast-undo:hover { background: var(--button-secondary-hover); color: var(--ink-on-bright); }

        /* 对话 Tab */
        .chat-section {
            flex: 1;
            display: none;
            flex-direction: column;
            overflow: hidden;
            /* 左右留 6px：给 :focus-visible outline（3px + offset 2px）让位 */
            padding: 0 6px;
        }
        .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px; }
        .chat-empty:not([hidden]) {
            margin: auto; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 14px; text-align: center; padding: 8px 12px; max-width: 90%;
        }
        .chat-empty .chat-empty-title { font-family: var(--font-display); font-size: var(--px-size-2x); font-weight: 400; color: var(--text-strong); margin: 0; }
        .chat-empty p { font-size: var(--text-meta); color: var(--text-secondary); margin: 0; line-height: 1.6; }
        .chat-empty .chat-suggest { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 4px; }
        .chat-empty .chat-suggest button {
            background: transparent; color: var(--text-secondary); border: 1px solid var(--border-strong);
            border-radius: 0; padding: 6px 12px; font-size: var(--px-size); cursor: pointer;
        }
        .chat-empty .chat-suggest button:hover { background: var(--button-secondary-hover); color: var(--ink-on-bright); border-color: var(--px-mark); }
        /* 气泡不靠底色区分，靠对齐 + 边框 —— lshu 知识页合同 */
        .chat-msg { max-width: 85%; padding: 8px 12px; border-radius: 0; font-size: var(--text-body); line-height: 1.5; white-space: pre-wrap; }
        .chat-msg.user { align-self: flex-end; background: transparent; border: 2px solid var(--action-primary); }
        .chat-msg.ai { align-self: flex-start; background: transparent; border: 1px solid var(--border-strong); }
        .chat-input-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            /* 底部留出 focus outline 空间 */
            padding-bottom: 6px;
        }
        .chat-input-row input {
            flex: 1; background: var(--surface-field);
            border: 1px solid var(--border-strong); border-radius: 0;
            color: var(--text-primary); padding: 9px 12px; font-size: var(--text-body);
            transition: border-color var(--dur-fast);
        }
        .chat-input-row input::placeholder { color: var(--text-faint); }
        .chat-input-row input:focus { border-color: var(--border-field); }
        .chat-input-row button {
            padding: 8px 16px; background: var(--action-primary);
            color: var(--action-on-text); border: 2px solid var(--action-primary); border-radius: 0; cursor: pointer; font-size: var(--px-size);
            box-shadow: var(--shadow-action);
            transition: transform var(--dur-fast);
        }
        .chat-input-row button:hover { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--px-line); }

        .footer { display: flex; gap: 8px; margin-top: 12px; border-top: 2px solid var(--border-strong); padding-top: 12px; }
        .footer-button {
            flex: 1; padding: 8px 0;
            background: transparent; color: var(--text-secondary);
            border: 1px solid var(--border-strong); border-radius: 0; cursor: pointer; font-size: var(--px-size);
            transition: background var(--dur-fast), color var(--dur-fast);
        }
        .footer-button:hover { background: var(--button-secondary-hover); color: var(--ink-on-bright); }

        /* 拖拽条 */
        .drag-bar {
            position: absolute; top: 0; left: 0; right: 0; height: 24px;
            -webkit-app-region: drag; cursor: grab; border-radius: 0;
        }
        body { position: relative; }

        /* 设置面板 */
        #settings-overlay {
            position: fixed; inset: 0; z-index: 20;
            background: var(--surface-scrim);
            display: none;
            align-items: center;
            justify-content: center;
        }
        #settings-overlay.show { display: flex; }
        #settings-panel {
            width: 80%;
            max-width: 320px;
            background: var(--surface-raised);
            border-radius: 0;
            padding: 16px;
            border: 2px solid var(--border-strong);
            box-shadow: none;
            transform-origin: center;
            animation: settings-in 0.14s steps(3, end);
        }
        @keyframes settings-in {
            from { transform: scale(0.97); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        #settings-panel h3 { font-family: var(--font-display); font-size: var(--px-size-2x); font-weight: 400; margin-bottom: 14px; color: var(--text-strong); padding-bottom: 8px; border-bottom: 2px solid var(--border-strong); }
        .setting-row { margin-bottom: 14px; }
        .setting-row .label { font-size: var(--text-meta); color: var(--text-secondary); margin-bottom: 6px; display: block; }
        .setting-row select, .setting-row input[type="number"], .setting-row input[type="text"] {
            width: 100%; padding: 7px 10px;
            background: var(--surface-field);
            color: var(--text-primary); border: 1px solid var(--border-strong);
            border-radius: 0; font-size: var(--text-meta);
            transition: border-color var(--dur-fast);
        }
        .setting-row select:focus, .setting-row input[type="number"]:focus, .setting-row input[type="text"]:focus { border-color: var(--border-field); }
        /* 快捷键录制框：点击后直接按下组合键录入 */
        .setting-row input.shortcut-field { cursor: pointer; }
        .setting-row input.shortcut-field:focus { outline: none; border-color: var(--action-primary); }
        .setting-row input.shortcut-field.recording { color: var(--text-faint); border-color: var(--action-primary); }
        /* 下拉选项跟随主题（色值走 token，不再硬编码暖黑，
           否则亮色主题下会掉出一个黑底弹层） */
        select option {
            background-color: var(--surface-field);
            color: var(--text-primary);
        }
        .setting-row .switch-row { display: flex; align-items: center; justify-content: space-between; }
        .setting-row .desc { font-size: var(--text-meta); color: var(--text-tertiary); margin-top: 4px; }
        /* 开关：直角方块，开启态橙底，不用绿色 */
        .switch {
            position: relative; width: 36px; height: 20px; flex-shrink: 0;
            background: var(--surface-field);
            border: 2px solid var(--border-strong);
            border-radius: 0;
            cursor: pointer; transition: background var(--dur-fast), border-color var(--dur-fast);
        }
        .switch.on { background: var(--action-on); border-color: var(--action-on); }
        .switch::after {
            content: ''; position: absolute; top: 0; left: 0;
            width: 16px; height: 16px; border-radius: 0;
            background: var(--border-strong);
            transition: transform var(--dur-fast), background var(--dur-fast);
        }
        .switch.on::after { transform: translateX(16px); background: var(--action-on-text); }
        .switch:focus-visible { outline-offset: 3px; }
        /* 主题三态：跟随系统 / 亮色 / 暗色（分段控制，与顶部 Tab 同构） */
        .theme-seg { display: flex; border: 1px solid var(--border-strong); }
        .theme-seg button {
            flex: 1; padding: 7px 2px;
            background: var(--surface-field); color: var(--text-secondary);
            border: none; border-right: 1px solid var(--border-strong);
            font-size: var(--px-size); cursor: pointer;
            transition: background var(--dur-fast), color var(--dur-fast);
        }
        .theme-seg button:last-child { border-right: none; }
        .theme-seg button:hover { background: var(--button-secondary-hover); color: var(--ink-on-bright); }
        .theme-seg button[aria-checked="true"] { background: var(--action-primary); color: var(--action-on-text); }
        .settings-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
        .settings-actions button {
            padding: 7px 14px; border-radius: 0;
            border: 1px solid var(--border-strong); cursor: pointer; font-size: var(--px-size);
            background: transparent; color: var(--text-secondary);
            transition: background var(--dur-fast), color var(--dur-fast);
        }
        .settings-actions button:hover { background: var(--button-secondary-hover); color: var(--ink-on-bright); }
        .settings-actions button.primary {
            background: var(--action-primary); border: 2px solid var(--action-primary);
            color: var(--action-on-text); box-shadow: var(--shadow-action);
            transition: transform var(--dur-fast);
        }
        .settings-actions button.primary:hover { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--px-line); }

        /* 无障碍：减少动态 */
        @media (prefers-reduced-motion: reduce) {
            .tab, .entry-item, .footer-button, .switch, .card-label, .dash-card,
            .tag-chip, .tag-reveal, .week-block .bar > i, .theme-seg button,
            .save-btn, .chat-input-row button, .settings-actions button { transition: none; }
            #settings-panel { animation: none; }
            .toast { transition: none; }
            .entry-item.flash { animation: none; background: transparent; }
            .ai-status.loading::before { animation: none; }
            .save-btn:hover, .chat-input-row button:hover, .settings-actions button.primary:hover { transform: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><span class="mod-code">NS-01</span>nanoSecretary</h1>
            <span class="ai-status loading" id="ai-status">AI 连接中</span>
        </div>

        <div class="tabs" role="tablist" aria-label="主视图">
            <button class="tab active" data-view="dashboard" id="view-tab-dashboard" role="tab" aria-selected="true" aria-controls="view-dashboard"><span id="tab-dashboard-icon"></span>仪表盘</button>
            <button class="tab" data-view="records" id="view-tab-records" role="tab" aria-selected="false" aria-controls="view-records"><span id="tab-records-icon"></span>记录<span class="count" id="record-count"></span></button>
            <button class="tab" data-view="chat" id="view-tab-chat" role="tab" aria-selected="false" aria-controls="view-chat"><span id="tab-chat-icon"></span>对话</button>
        </div>

        <!-- 仪表盘视图（bento，默认） -->
        <div id="view-dashboard" role="tabpanel" aria-labelledby="view-tab-dashboard">
            <!-- 上排：关注卡做主角（左），今日/本周让位（右列） -->
            <div class="dash-row" id="dash-top-row">
                <!-- 主卡：关注环 —— 中心 = 全部待处理（诚实含无日期） -->
                <div class="dash-card attention clickable" id="card-attention" role="button" tabindex="0" aria-label="关注：查看待办">
                    <div class="card-label"><span class="mod-code">01</span>关注</div>
                    <div class="ring-wrap" id="ring-attention"></div>
                    <div class="legend" id="attention-legend"></div>
                </div>
                <!-- 右侧列：今日 + 本周（本周去环，压成文字行） -->
                <div class="dash-col" id="dash-col-side">
                    <!-- 今日总览环 -->
                    <div class="dash-card side clickable" id="card-today" role="button" tabindex="0" aria-label="今日：查看记录">
                        <div class="card-label"><span class="mod-code">02</span>今日</div>
                        <div class="ring-wrap" id="ring-today"></div>
                        <div class="next-todo" id="today-next" role="button" tabindex="0" title="跳转到记录"></div>
                    </div>
                    <!-- 本周：去环，压成一行进度（distill：不抢主卡注意力） -->
                    <div class="dash-card side clickable" id="card-week" role="button" tabindex="0" aria-label="本周完成：查看记录">
                        <div class="card-label"><span class="mod-code">03</span>本周</div>
                        <div class="week-block" id="week-block"></div>
                        <div class="dash-foot" id="week-foot"></div>
                    </div>
                </div>
            </div>
            <!-- tag：Top-3 芯片 + 展开详情（distill：弱化非主角信息） -->
            <div class="dash-tags" id="dash-tags">
                <div class="tags-label"><span class="mod-code">04</span>标签待办</div>
                <div class="tag-chips top-three" id="tag-chips"></div>
                <button type="button" class="tag-reveal" id="tag-reveal" hidden></button>
                <div class="tag-detail" id="tag-detail"></div>
            </div>
        </div>

        <!-- 记录视图 -->
        <div id="view-records" role="tabpanel" aria-labelledby="view-tab-records">
            <div class="input-section">
                <label for="input-text" class="visually-hidden" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">快速记录</label>
                <textarea id="input-text" placeholder="随手记：比如「下周三交季度报告 #工作」，AI 会自动识别截止日期…"></textarea>
                <div class="save-row">
                    <button class="save-btn" id="save-button" type="button">保存</button>
                    <span style="font-size: var(--text-meta);color: var(--text-tertiary)">Ctrl+Enter 保存</span>
                </div>
                <div id="ai-preview-box"></div>
            </div>

            <div class="list-section">
                <div class="filter-bar" id="todo-filter" hidden>
                    <span>筛选：<span class="filter-tag" id="todo-filter-tag"></span></span>
                    <button type="button" class="filter-clear" id="todo-filter-clear">清除</button>
                </div>
                <h2><span class="mod-code">05</span>待办事项</h2>
                <div class="entry-list" id="todo-list"></div>
                <h2 style="margin-top:12px;"><span class="mod-code">06</span>最近记录</h2>
                <div class="entry-list" id="recent-list"></div>
            </div>
        </div>

        <!-- 对话视图 -->
        <div class="chat-section" id="view-chat" role="tabpanel" aria-labelledby="view-tab-chat">
            <div class="chat-messages" id="chat-messages">
                <div class="chat-empty" id="chat-empty">
                    <p class="chat-empty-title">你的 nanoSecretary 在线</p>
                    <p>问我关于待办、日程、逾期的一切，或从下面挑一个开始。</p>
                    <div class="chat-suggest">
                        <button type="button" data-chat="我今天有什么安排？">我今天有什么安排？</button>
                        <button type="button" data-chat="我这个月逾期了哪些？">我这个月逾期了哪些？</button>
                        <button type="button" data-chat="帮我整理今天的进度">帮我整理今天的进度</button>
                    </div>
                </div>
            </div>
            <div class="chat-input-row">
                <label for="chat-input" class="visually-hidden" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">对话输入</label>
                <input type="text" id="chat-input" placeholder="问你的 nanoSecretary…（如：我今天有什么安排？）">
                <button id="chat-send" type="button">发送</button>
            </div>
        </div>

        <div class="footer">
            <button class="footer-button" id="history-button" type="button">历史记录</button>
            <button class="footer-button" id="sticky-button" type="button">便签</button>
            <button class="footer-button" id="settings-button" type="button">设置</button>
            <button class="footer-button" id="close-button" type="button">收起</button>
        </div>
    </div>

    <!-- 设置面板 -->
    <div id="settings-overlay" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div id="settings-panel">
            <h3 id="settings-title">设置</h3>
            <div class="setting-row">
                <span class="label" id="set-theme-label">主题</span>
                <div class="theme-seg" role="radiogroup" aria-labelledby="set-theme-label" id="set-theme">
                    <button type="button" role="radio" data-theme="system" aria-checked="true">跟随系统</button>
                    <button type="button" role="radio" data-theme="light" aria-checked="false">亮色</button>
                    <button type="button" role="radio" data-theme="dark" aria-checked="false">暗色</button>
                </div>
                <div class="desc">跟随系统时会随 Windows 明暗设置实时切换</div>
            </div>
            <div class="setting-row">
                <label class="label" for="set-model">Ollama 模型</label>
                <select id="set-model"></select>
                <div class="desc" id="set-model-desc">未检测到本地模型</div>
            </div>
            <div class="setting-row">
                <label class="label" for="set-lead">提醒提前量（小时）</label>
                <input type="number" id="set-lead" min="0" max="168" value="24">
                <div class="desc">截止前多久开始提醒，0 = 仅当天提醒</div>
            </div>
            <div class="setting-row">
                <div class="switch-row">
                    <span class="label" style="margin:0;">AI 智能解析</span>
                    <div class="switch" id="set-ai-switch" role="switch" aria-checked="true" aria-label="AI 智能解析" tabindex="0"></div>
                </div>
                <div class="desc">关闭后仅保存文本，不做 AI 提取</div>
            </div>
            <div class="setting-row">
                <div class="switch-row">
                    <span class="label" style="margin:0;">显示悬浮球</span>
                    <div class="switch" id="set-ball-switch" role="switch" aria-checked="true" aria-label="显示悬浮球" tabindex="0"></div>
                </div>
                <div class="desc">关闭后仅在托盘运行，用快捷键唤起输入面板</div>
            </div>
            <div class="setting-row">
                <label class="label" for="set-shortcut">全局快捷键</label>
                <input type="text" id="set-shortcut" class="shortcut-field" readonly placeholder="按下组合键…"
                       aria-describedby="set-shortcut-desc">
                <div class="desc" id="set-shortcut-desc">点击后按下组合键录入；需至少一个修饰键（Ctrl / Alt / Shift）</div>
            </div>
            <div class="settings-actions">
                <button id="set-cancel" type="button">取消</button>
                <button class="primary" id="set-save" type="button">保存</button>
            </div>
        </div>
    </div>

    <!-- 轻量反馈 toast -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="icons.js"></script>
    <!-- 日期选择器：react-day-picker 日历本体（构建产物）+ 原生封装 -->
    <script src="date-picker-react.js"></script>
    <script src="date-picker.js"></script>
    <script src="homepage.js"></script>
</body>
</html>
