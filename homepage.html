<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 内容安全策略：仅本机脚本；样式允许内联（无构建工具链） -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
    <title>nanoSecretary</title>
    <link rel="stylesheet" href="tokens.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: transparent;
            color: var(--text-strong);
            font-family: var(--font-stack);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* 无障碍：键盘焦点指示（全局） */
        :focus-visible {
            outline: 2px solid var(--action-focus);
            outline-offset: 2px;
            border-radius: 4px;
        }
        /* 统一线性图标 */
        .icon { display: inline-block; vertical-align: -2px; }
        .icon.inline { margin-right: 5px; }

        .container {
            flex: 1;
            background: var(--surface-main);
            backdrop-filter: blur(18px) saturate(170%);
            border-radius: 16px;
            margin: 14px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-card);
            overflow: hidden;
        }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        /* 大标题：负字距收紧，更精致（Apple 排版 §15） */
        .header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; }
        .header .ai-status {
            font-size: var(--text-meta); color: var(--text-secondary);
            padding: 4px 10px; border-radius: var(--radius-chip);
            background: var(--surface-chip);
        }
        .header .ai-status.online { color: var(--status-ai-online); background: rgba(80,200,120,0.15); }
        .header .ai-status.offline { color: var(--text-secondary); }

        /* 顶部 Tab */
        .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
        .tab {
            flex: 1;
            padding: 8px 0;
            font-size: var(--text-body);
            border-radius: var(--radius-card);
            background: var(--surface-tab);
            color: var(--text-tertiary);
            border: none;
            cursor: pointer;
            transition: background var(--dur-fast), color var(--dur-fast);
        }
        .tab.active { background: rgba(120,180,255,0.22); color: var(--text-strong); }
        .tab .count { opacity: 0.6; font-size: var(--text-meta); margin-left: 4px; }

        /* 记录 Tab */
        #view-records {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0; /* 允许内部滚动 */
        }
        .input-section { margin-bottom: 10px; flex-shrink: 0; }
        .input-section textarea {
            width: 100%; height: 70px;
            background: var(--surface-field);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-card);
            color: var(--text-primary); padding: 10px 12px;
            font-size: var(--text-body); resize: none;
            font-family: inherit;
        }
        .input-section textarea:focus { border-color: var(--border-field); }
        .input-section .save-row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
        /* 主 CTA：深蓝渐变，白字对比 ≥ 4.5:1 */
        .save-btn {
            padding: 7px 18px;
            background: var(--action-gradient);
            color: var(--text-strong); border: none; border-radius: var(--radius-btn);
            cursor: pointer; font-size: var(--text-body);
        }
        .save-btn:hover { filter: brightness(1.12); }
        #ai-preview-box {
            margin-top: 8px; padding: 8px 10px;
            background: rgba(120,180,255,0.1); border: 1px solid rgba(120,180,255,0.2);
            border-radius: var(--radius-btn); font-size: var(--text-meta); display: none;
            color: var(--text-primary);
        }

        /* 待办列表 */
        .list-section { flex: 1; min-height: 0; overflow-y: auto; }
        .list-section h2 { font-size: var(--text-body); color: var(--text-secondary); margin: 6px 0 8px; font-weight: var(--weight-strong); }
        .entry-list { display: flex; flex-direction: column; gap: 8px; }
        .entry-item {
            background: var(--surface-card);
            border-radius: var(--radius-card); padding: 10px 12px;
            border-left: 3px solid transparent;
            transition: background var(--dur-fast);
        }
        .entry-item:hover { background: var(--surface-card-hover); }
        .entry-item.overdue { border-left-color: var(--status-danger); }
        .entry-item.today { border-left-color: var(--status-warning-strong); }
        .entry-item.note { border-left-color: var(--status-note); }
        .entry-title { font-size: var(--text-body); margin-bottom: 4px; font-weight: var(--weight-strong); }
        .entry-meta { display: flex; gap: 8px; font-size: var(--text-meta); color: var(--text-secondary); align-items: center; flex-wrap: wrap; }
        .entry-meta .due { color: var(--status-warning-strong); }
        .entry-meta .due.overdue { color: var(--status-danger-text); }
        .entry-meta .priority-high { color: var(--status-danger-text); }
        .entry-meta .priority-mid { color: var(--status-warning-strong); }
        .entry-meta .cat { padding: 1px 8px; border-radius: var(--radius-chip); background: var(--surface-chip); }
        .entry-actions { margin-top: 6px; display: flex; gap: 8px; }
        .entry-actions button {
            background: var(--button-secondary); color: var(--text-primary);
            border: none; padding: 3px 10px; border-radius: var(--radius-field);
            font-size: var(--text-meta); cursor: pointer;
        }
        .entry-actions button:hover { background: var(--button-secondary-hover); }
        .entry-actions .done-btn:hover { background: var(--status-success-bg); }
        .empty { text-align: center; color: var(--text-tertiary); padding: 30px 0; font-size: var(--text-body); }

        /* 删除确认条（内联，替代系统 confirm） */
        .confirm-bar {
            margin-top: 6px; display: flex; gap: 8px; align-items: center;
            font-size: var(--text-meta); color: var(--text-secondary);
        }
        .confirm-bar .confirm-btns { display: flex; gap: 6px; }
        .confirm-bar button {
            background: var(--status-danger-bg); color: var(--text-strong);
            border: none; padding: 3px 10px; border-radius: var(--radius-field);
            font-size: var(--text-meta); cursor: pointer;
        }
        .confirm-bar button.confirm-no { background: var(--button-secondary); color: var(--text-secondary); }

        /* 对话 Tab */
        .chat-section { flex: 1; display: none; flex-direction: column; overflow: hidden; }
        .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px; }
        .chat-msg { max-width: 85%; padding: 8px 12px; border-radius: 12px; font-size: var(--text-body); line-height: 1.5; white-space: pre-wrap; }
        .chat-msg.user { align-self: flex-end; background: rgba(120,180,255,0.25); border-bottom-right-radius: 4px; }
        .chat-msg.ai { align-self: flex-start; background: var(--surface-chip); border-bottom-left-radius: 4px; }
        .chat-input-row { display: flex; gap: 8px; margin-top: 10px; }
        .chat-input-row input {
            flex: 1; background: var(--surface-field);
            border: 1px solid var(--border-soft); border-radius: var(--radius-card);
            color: var(--text-primary); padding: 9px 12px; font-size: var(--text-body);
        }
        .chat-input-row input:focus { border-color: var(--border-field); }
        .chat-input-row button {
            padding: 8px 16px; background: var(--action-gradient);
            color: var(--text-strong); border: none; border-radius: var(--radius-card); cursor: pointer; font-size: var(--text-body);
        }
        .chat-input-row button:hover { filter: brightness(1.12); }

        .footer { display: flex; gap: 8px; margin-top: 12px; }
        .footer-button {
            flex: 1; padding: 8px 0;
            background: var(--button-secondary); color: var(--text-secondary);
            border: none; border-radius: var(--radius-btn); cursor: pointer; font-size: var(--text-meta);
        }
        .footer-button:hover { background: var(--button-secondary-hover); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--surface-scroll); border-radius: 3px; }

        /* 拖拽条 */
        .drag-bar {
            position: absolute; top: 0; left: 0; right: 0; height: 24px;
            -webkit-app-region: drag; cursor: grab; border-radius: 16px 16px 0 0;
        }
        body { position: relative; }

        /* 设置面板 */
        #settings-overlay {
            position: fixed; inset: 0; z-index: 20;
            background: var(--surface-scrim);
            display: none;
            align-items: center;
            justify-content: center;
        }
        #settings-overlay.show { display: flex; }
        #settings-panel {
            width: 80%;
            max-width: 320px;
            background: var(--surface-raised);
            backdrop-filter: blur(18px) saturate(160%);
            border-radius: var(--radius-panel);
            padding: 18px;
            border: 1px solid var(--border-soft);
            box-shadow: var(--shadow-dialog);
            transform-origin: center;
            animation: settings-in 0.2s ease-out;
        }
        @keyframes settings-in {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        #settings-panel h3 { font-size: var(--text-title); margin-bottom: 14px; }
        .setting-row { margin-bottom: 14px; }
        .setting-row .label { font-size: var(--text-meta); color: var(--text-secondary); margin-bottom: 6px; display: block; }
        .setting-row select, .setting-row input[type="number"] {
            width: 100%; padding: 7px 10px;
            background: var(--surface-field);
            color: var(--text-primary); border: 1px solid var(--border-soft);
            border-radius: var(--radius-btn); font-size: var(--text-meta);
            color-scheme: dark;
        }
        /* 下拉选项强制黑底白字 */
        select option {
            background-color: #1e1e24;
            color: white;
        }
        .setting-row .switch-row { display: flex; align-items: center; justify-content: space-between; }
        .setting-row .desc { font-size: var(--text-meta); color: var(--text-faint); margin-top: 4px; }
        .switch {
            position: relative; width: 40px; height: 22px;
            background: rgba(255,255,255,0.15); border-radius: 11px;
            cursor: pointer; transition: background var(--dur-fast);
        }
        .switch.on { background: var(--action-on); }
        .switch::after {
            content: ''; position: absolute; top: 2px; left: 2px;
            width: 18px; height: 18px; border-radius: 50%;
            background: white; transition: transform var(--dur-fast);
        }
        .switch.on::after { transform: translateX(18px); }
        .switch:focus-visible { outline-offset: 3px; }
        .settings-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
        .settings-actions button {
            padding: 6px 14px; border-radius: var(--radius-btn);
            border: none; cursor: pointer; font-size: var(--text-meta);
            background: var(--button-secondary); color: var(--text-strong);
        }
        .settings-actions button.primary { background: var(--action-on-strong); color: #111; }

        /* 无障碍：减少动态 */
        @media (prefers-reduced-motion: reduce) {
            .tab, .entry-item, .footer-button, .switch { transition: none; }
            #settings-panel { animation: none; }
        }
        @media (prefers-reduced-transparency: reduce) {
            .container { background: var(--surface-main-solid); backdrop-filter: blur(4px); }
            #settings-panel { background: var(--surface-raised-solid); backdrop-filter: blur(4px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>nanoSecretary</h1>
            <span class="ai-status" id="ai-status">AI 连接中…</span>
        </div>

        <div class="tabs" role="tablist" aria-label="主视图">
            <button class="tab active" data-view="records" id="view-tab-records" role="tab" aria-selected="true"><span id="tab-records-icon"></span>记录<span class="count" id="record-count"></span></button>
            <button class="tab" data-view="chat" id="view-tab-chat" role="tab" aria-selected="false"><span id="tab-chat-icon"></span>对话</button>
        </div>

        <!-- 记录视图 -->
        <div id="view-records" role="tabpanel" aria-labelledby="view-tab-records">
            <div class="input-section">
                <label for="input-text" class="visually-hidden" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">快速记录</label>
                <textarea id="input-text" placeholder="随手记：比如「下周三交季度报告 #工作」，AI 会自动识别截止日期…"></textarea>
                <div class="save-row">
                    <button class="save-btn" id="save-button" type="button">保存</button>
                    <span style="font-size: var(--text-meta);color: var(--text-faint)">Ctrl+Enter 保存</span>
                </div>
                <div id="ai-preview-box"></div>
            </div>

            <div class="list-section">
                <h2>待办事项</h2>
                <div class="entry-list" id="todo-list"></div>
                <h2 style="margin-top:12px;">最近记录</h2>
                <div class="entry-list" id="recent-list"></div>
            </div>
        </div>

        <!-- 对话视图 -->
        <div class="chat-section" id="view-chat" role="tabpanel" aria-labelledby="view-tab-chat">
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input-row">
                <label for="chat-input" class="visually-hidden" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">对话输入</label>
                <input type="text" id="chat-input" placeholder="问你的 nanoSecretary…（如：我今天有什么安排？）">
                <button id="chat-send" type="button">发送</button>
            </div>
        </div>

        <div class="footer">
            <button class="footer-button" id="history-button" type="button">历史记录</button>
            <button class="footer-button" id="settings-button" type="button">设置</button>
            <button class="footer-button" id="close-button" type="button">收起</button>
        </div>
    </div>

    <!-- 设置面板 -->
    <div id="settings-overlay" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div id="settings-panel">
            <h3 id="settings-title">设置</h3>
            <div class="setting-row">
                <label class="label" for="set-model">Ollama 模型</label>
                <select id="set-model"></select>
                <div class="desc" id="set-model-desc">未检测到本地模型</div>
            </div>
            <div class="setting-row">
                <label class="label" for="set-lead">提醒提前量（小时）</label>
                <input type="number" id="set-lead" min="0" max="168" value="24">
                <div class="desc">截止前多久开始提醒，0 = 仅当天提醒</div>
            </div>
            <div class="setting-row">
                <div class="switch-row">
                    <span class="label" style="margin:0;">AI 智能解析</span>
                    <div class="switch" id="set-ai-switch" role="switch" aria-checked="true" aria-label="AI 智能解析" tabindex="0"></div>
                </div>
                <div class="desc">关闭后仅保存文本，不做 AI 提取</div>
            </div>
            <div class="settings-actions">
                <button id="set-cancel" type="button">取消</button>
                <button class="primary" id="set-save" type="button">保存</button>
            </div>
        </div>
    </div>

    <script src="icons.js"></script>
    <script src="homepage.js"></script>
</body>
</html>
