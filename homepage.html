<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 内容安全策略：仅本机脚本；样式允许内联（无构建工具链） -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
    <title>nanoSecretary</title>
    <style>
        /* 根字号基准：1rem = 16px，布局随系统字号缩放 */
        html { font-size: 100%; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: transparent;
            color: white;
            font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* 无障碍：键盘焦点指示（全局） */
        :focus-visible {
            outline: 2px solid rgba(120, 180, 255, 0.9);
            outline-offset: 2px;
            border-radius: 4px;
        }
        .container {
            flex: 1;
            background: rgba(24, 24, 28, 0.9);
            backdrop-filter: blur(18px) saturate(170%);
            border-radius: 16px;
            margin: 14px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255,255,255,0.07);
            box-shadow: 0 8px 40px rgba(0,0,0,0.4);
            overflow: hidden;
        }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        /* 大标题：负字距收紧，更精致（Apple 排版 §15） */
        .header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; }
        .header .ai-status {
            font-size: 0.6875rem; color: rgba(255,255,255,0.65);
            padding: 4px 10px; border-radius: 20px;
            background: rgba(255,255,255,0.08);
        }
        .header .ai-status.online { color: #8be8b2; background: rgba(80,200,120,0.15); }
        .header .ai-status.offline { color: rgba(255,255,255,0.6); }

        /* 顶部 Tab */
        .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
        .tab {
            flex: 1;
            padding: 8px 0;
            font-size: 0.8125rem;
            border-radius: 10px;
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.6);
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab.active { background: rgba(120,180,255,0.22); color: white; }
        .tab .count { opacity: 0.6; font-size: 0.6875rem; margin-left: 4px; }

        /* 记录 Tab */
        #view-records {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0; /* 允许内部滚动 */
        }
        .input-section { margin-bottom: 10px; flex-shrink: 0; }
        .input-section textarea {
            width: 100%; height: 70px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: white; padding: 10px 12px;
            font-size: 0.8125rem; resize: none;
            font-family: inherit;
        }
        .input-section textarea:focus { border-color: rgba(120,180,255,0.4); }
        .input-section .save-row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
        .save-btn {
            padding: 7px 18px;
            background: linear-gradient(135deg, rgba(120,180,255,0.9), rgba(90,140,255,0.9));
            color: white; border: none; border-radius: 8px;
            cursor: pointer; font-size: 0.8125rem;
        }
        .save-btn:hover { filter: brightness(1.12); }
        #ai-preview-box {
            margin-top: 8px; padding: 8px 10px;
            background: rgba(120,180,255,0.1); border: 1px solid rgba(120,180,255,0.2);
            border-radius: 8px; font-size: 0.75rem; display: none;
            color: rgba(255,255,255,0.85);
        }

        /* 待办列表 */
        .list-section { flex: 1; min-height: 0; overflow-y: auto; }
        .list-section h2 { font-size: 0.8125rem; color: rgba(255,255,255,0.7); margin: 6px 0 8px; font-weight: 600; }
        .entry-list { display: flex; flex-direction: column; gap: 8px; }
        .entry-item {
            background: rgba(255,255,255,0.05);
            border-radius: 10px; padding: 10px 12px;
            border-left: 3px solid transparent;
            transition: background 0.2s;
        }
        .entry-item:hover { background: rgba(255,255,255,0.09); }
        .entry-item.overdue { border-left-color: #e5484d; }
        .entry-item.today { border-left-color: #ff8c42; }
        .entry-item.note { border-left-color: #888; }
        .entry-title { font-size: 0.8125rem; margin-bottom: 4px; font-weight: 600; }
        .entry-meta { display: flex; gap: 8px; font-size: 0.6875rem; color: rgba(255,255,255,0.7); align-items: center; flex-wrap: wrap; }
        .entry-meta .due { color: #ff8c42; }
        .entry-meta .due.overdue { color: #e5484d; }
        .entry-meta .priority-high { color: #e5484d; }
        .entry-meta .priority-mid { color: #ff8c42; }
        .entry-meta .cat { padding: 1px 8px; border-radius: 10px; background: rgba(255,255,255,0.1); }
        .entry-actions { margin-top: 6px; display: flex; gap: 8px; }
        .entry-actions button {
            background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.8);
            border: none; padding: 3px 10px; border-radius: 6px;
            font-size: 0.6875rem; cursor: pointer;
        }
        .entry-actions button:hover { background: rgba(255,255,255,0.16); }
        .entry-actions .done-btn:hover { background: rgba(80,200,120,0.3); }
        .empty { text-align: center; color: rgba(255,255,255,0.45); padding: 30px 0; font-size: 0.8125rem; }

        /* 对话 Tab */
        .chat-section { flex: 1; display: none; flex-direction: column; overflow: hidden; }
        .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px; }
        .chat-msg { max-width: 85%; padding: 8px 12px; border-radius: 12px; font-size: 0.8125rem; line-height: 1.5; white-space: pre-wrap; }
        .chat-msg.user { align-self: flex-end; background: rgba(120,180,255,0.25); border-bottom-right-radius: 4px; }
        .chat-msg.ai { align-self: flex-start; background: rgba(255,255,255,0.08); border-bottom-left-radius: 4px; }
        .chat-input-row { display: flex; gap: 8px; margin-top: 10px; }
        .chat-input-row input {
            flex: 1; background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
            color: white; padding: 9px 12px; font-size: 0.8125rem;
        }
        .chat-input-row input:focus { border-color: rgba(120,180,255,0.4); }
        .chat-input-row button {
            padding: 8px 16px; background: linear-gradient(135deg, rgba(120,180,255,0.9), rgba(90,140,255,0.9));
            color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 0.8125rem;
        }

        .footer { display: flex; gap: 8px; margin-top: 12px; }
        .footer-button {
            flex: 1; padding: 8px 0;
            background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.75);
            border: none; border-radius: 8px; cursor: pointer; font-size: 0.75rem;
        }
        .footer-button:hover { background: rgba(255,255,255,0.14); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

        /* 拖拽条 */
        .drag-bar {
            position: absolute; top: 0; left: 0; right: 0; height: 24px;
            -webkit-app-region: drag; cursor: grab; border-radius: 16px 16px 0 0;
        }
        body { position: relative; }

        /* 设置面板 */
        #settings-overlay {
            position: fixed; inset: 0; z-index: 20;
            background: rgba(0,0,0,0.4);
            display: none;
            align-items: center;
            justify-content: center;
        }
        #settings-overlay.show { display: flex; }
        #settings-panel {
            width: 80%;
            max-width: 320px;
            background: rgba(30,30,36,0.97);
            backdrop-filter: blur(18px) saturate(160%);
            border-radius: 14px;
            padding: 18px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
            transform-origin: center;
            animation: settings-in 0.2s ease-out;
        }
        @keyframes settings-in {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        #settings-panel h3 { font-size: 0.9375rem; margin-bottom: 14px; }
        .setting-row { margin-bottom: 14px; }
        .setting-row .label { font-size: 0.75rem; color: rgba(255,255,255,0.7); margin-bottom: 6px; display: block; }
        .setting-row select, .setting-row input[type="number"] {
            width: 100%; padding: 7px 10px;
            background: rgba(255,255,255,0.08);
            color: white; border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px; font-size: 0.75rem;
            color-scheme: dark;
        }
        /* 下拉选项强制黑底白字 */
        select option {
            background-color: #1e1e24;
            color: white;
        }
        .setting-row .switch-row { display: flex; align-items: center; justify-content: space-between; }
        .setting-row .desc { font-size: 0.6875rem; color: rgba(255,255,255,0.5); margin-top: 4px; }
        .switch {
            position: relative; width: 40px; height: 22px;
            background: rgba(255,255,255,0.15); border-radius: 11px;
            cursor: pointer; transition: background 0.2s;
        }
        .switch.on { background: rgba(120,180,255,0.7); }
        .switch::after {
            content: ''; position: absolute; top: 2px; left: 2px;
            width: 18px; height: 18px; border-radius: 50%;
            background: white; transition: transform 0.2s;
        }
        .switch.on::after { transform: translateX(18px); }
        .switch:focus-visible { outline-offset: 3px; }
        .settings-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
        .settings-actions button {
            padding: 6px 14px; border-radius: 8px;
            border: none; cursor: pointer; font-size: 0.75rem;
            background: rgba(255,255,255,0.1); color: white;
        }
        .settings-actions button.primary { background: rgba(120,180,255,0.8); color: #111; }

        /* 无障碍：减少动态 */
        @media (prefers-reduced-motion: reduce) {
            .tab, .entry-item, .footer-button, .switch { transition: none; }
            #settings-panel { animation: none; }
        }
        @media (prefers-reduced-transparency: reduce) {
            .container { background: rgba(24, 24, 28, 0.98); backdrop-filter: blur(4px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>nanoSecretary</h1>
            <span class="ai-status" id="ai-status">AI 连接中…</span>
        </div>

        <div class="tabs" role="tablist" aria-label="主视图">
            <button class="tab active" data-view="records" id="view-tab-records" role="tab" aria-selected="true">📋 记录<span class="count" id="record-count"></span></button>
            <button class="tab" data-view="chat" id="view-tab-chat" role="tab" aria-selected="false">💬 对话</button>
        </div>

        <!-- 记录视图 -->
        <div id="view-records" role="tabpanel" aria-labelledby="view-tab-records">
            <div class="input-section">
                <label for="input-text" class="visually-hidden" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">快速记录</label>
                <textarea id="input-text" placeholder="随手记：比如「下周三交季度报告 #工作」，AI 会自动识别截止日期…"></textarea>
                <div class="save-row">
                    <button class="save-btn" id="save-button" type="button">保存</button>
                    <span style="font-size: 0.6875rem;color:rgba(255,255,255,0.5)">Ctrl+Enter 保存</span>
                </div>
                <div id="ai-preview-box"></div>
            </div>

            <div class="list-section">
                <h2>待办事项</h2>
                <div class="entry-list" id="todo-list"></div>
                <h2 style="margin-top:12px;">最近记录</h2>
                <div class="entry-list" id="recent-list"></div>
            </div>
        </div>

        <!-- 对话视图 -->
        <div class="chat-section" id="view-chat" role="tabpanel" aria-labelledby="view-tab-chat">
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input-row">
                <label for="chat-input" class="visually-hidden" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">对话输入</label>
                <input type="text" id="chat-input" placeholder="问你的 nanoSecretary…（如：我今天有什么安排？）">
                <button id="chat-send" type="button">发送</button>
            </div>
        </div>

        <div class="footer">
            <button class="footer-button" id="history-button" type="button">历史记录</button>
            <button class="footer-button" id="settings-button" type="button">设置</button>
            <button class="footer-button" id="close-button" type="button">收起</button>
        </div>
    </div>

    <!-- 设置面板 -->
    <div id="settings-overlay" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div id="settings-panel">
            <h3 id="settings-title">设置</h3>
            <div class="setting-row">
                <label class="label" for="set-model">Ollama 模型</label>
                <select id="set-model"></select>
                <div class="desc" id="set-model-desc">未检测到本地模型</div>
            </div>
            <div class="setting-row">
                <label class="label" for="set-lead">提醒提前量（小时）</label>
                <input type="number" id="set-lead" min="0" max="168" value="24">
                <div class="desc">截止前多久开始提醒，0 = 仅当天提醒</div>
            </div>
            <div class="setting-row">
                <div class="switch-row">
                    <span class="label" style="margin:0;">AI 智能解析</span>
                    <div class="switch" id="set-ai-switch" role="switch" aria-checked="true" aria-label="AI 智能解析" tabindex="0"></div>
                </div>
                <div class="desc">关闭后仅保存文本，不做 AI 提取</div>
            </div>
            <div class="settings-actions">
                <button id="set-cancel" type="button">取消</button>
                <button class="primary" id="set-save" type="button">保存</button>
            </div>
        </div>
    </div>

    <script src="homepage.js"></script>
</body>
</html>
