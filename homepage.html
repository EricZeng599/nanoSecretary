<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 内容安全策略：仅本机脚本；样式允许内联（无构建工具链） -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
    <title>nanoSecretary</title>
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="date-picker-react.css">
    <link rel="stylesheet" href="date-picker.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: transparent;
            color: var(--text-strong);
            font-family: var(--font-stack);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* 无障碍：键盘焦点指示（赭橙） */
        :focus-visible {
            outline: 2px solid var(--action-focus);
            outline-offset: 2px;
            border-radius: 2px;
        }
        /* 统一线性图标 */
        .icon { display: inline-block; vertical-align: -2px; }
        .icon.inline { margin-right: 5px; }

        .container {
            flex: 1;
            background: var(--surface-main);
            border-radius: var(--radius-panel);
            margin: 12px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-card);
            overflow: hidden;
        }
        .header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
        /* 大标题：serif editorial（Georgia 回退 Lora） */
        .header h1 {
            font-family: var(--font-display);
            font-size: 1.25rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            color: var(--text-strong);
        }
        .header .ai-status {
            font-size: var(--text-meta); color: var(--text-tertiary);
            padding: 3px 10px; border-radius: var(--radius-chip);
            background: var(--surface-chip);
            letter-spacing: 0.01em;
        }
        .header .ai-status.online { color: var(--status-ai-online); background: rgba(111,168,107,0.15); }
        .header .ai-status.offline { color: var(--text-tertiary); }

        /* 顶部 Tab */
        .tabs { display: flex; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid var(--border-subtle); }
        .tab {
            flex: 1;
            padding: 9px 0 8px;
            font-size: var(--text-body);
            border: none;
            background: transparent;
            color: var(--text-tertiary);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: color var(--dur-fast), border-color var(--dur-fast);
        }
        .tab:hover { color: var(--text-secondary); }
        .tab.active {
            color: var(--text-strong);
            border-bottom-color: var(--action-primary);
        }
        .tab .count { opacity: 0.6; font-size: var(--text-meta); margin-left: 4px; }

        /* ===== 仪表盘视图（bento） ===== */
        #view-dashboard {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            gap: 12px;
        }
        /* 上排：三张环卡（今日/三色关注/本周完成） */
        .dash-row { display: flex; gap: 12px; }
        .dash-card {
            flex: 1;
            min-width: 0;
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-card);
            padding: 16px 14px 14px;
            display: flex;
            flex-direction: column;
            transition: background var(--dur-fast);
        }
        .dash-card.clickable { cursor: pointer; }
        .dash-card.clickable:hover { background: var(--surface-card-hover); }
        .dash-card .card-label {
            font-size: var(--text-meta);
            color: var(--text-tertiary);
            letter-spacing: 0.06em;
            margin-bottom: 10px;
            display: flex; align-items: center; gap: 6px;
        }
        .dash-card .card-label .icon { width: 12px; height: 12px; }
        /* 环区 */
        .ring-wrap {
            position: relative;
            width: 108px; height: 108px;
            margin: 0 auto 10px;
        }
        .ring-wrap svg { display: block; }
        .ring-center {
            position: absolute; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            pointer-events: none;
        }
        .ring-center .big {
            font-family: var(--font-display);
            font-size: 1.75rem;
            font-weight: 500;
            line-height: 1;
            color: var(--text-strong);
            letter-spacing: -0.01em;
        }
        .ring-center .big small { font-size: 0.9rem; }
        .ring-center .sub {
            font-size: var(--text-tiny);
            color: var(--text-faint);
            margin-top: 2px;
        }
        /* 环下注释行 */
        .dash-foot {
            text-align: center;
            font-size: var(--text-meta);
            color: var(--text-tertiary);
            margin-top: auto;
            padding-top: 8px;
            line-height: 1.5;
        }
        .dash-foot .hl { color: var(--text-strong); font-weight: 500; }
        /* 三色图例行 */
        .legend {
            display: flex; flex-direction: column;
            gap: 4px; margin-top: 6px;
            font-size: var(--text-tiny);
            color: var(--text-tertiary);
        }
        .legend .row { display: flex; align-items: center; gap: 6px; }
        .legend .swatch { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
        .legend .row .n { margin-left: auto; color: var(--text-secondary); font-family: var(--font-display); }
        /* 「近7天完成」是独立计数，不是环段：无 swatch，用左缩进对齐带点的行 */
        .legend .done-note { margin-left: 14px; }
        /* 今日副行（下一件） */
        .next-todo {
            display: flex; align-items: center; gap: 6px;
            font-size: var(--text-meta); color: var(--text-secondary);
            margin-top: 8px; padding-top: 8px;
            border-top: 1px solid var(--border-subtle);
            cursor: pointer;
        }
        .next-todo:hover .hl { color: var(--action-primary); }
        .next-todo .hl {
            overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
            color: var(--text-strong); font-weight: 500;
        }
        /* 底部：tag 格 */
        .dash-tags {
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-card);
            padding: 12px 14px;
        }
        .dash-tags .tags-label {
            font-size: var(--text-meta); color: var(--text-tertiary);
            letter-spacing: 0.06em; margin-bottom: 8px;
        }
        .tag-chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .tag-chip {
            padding: 3px 10px;
            background: transparent;
            color: var(--text-tertiary);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-chip);
            cursor: pointer; font-size: var(--text-meta);
            transition: all var(--dur-fast);
            display: inline-flex; align-items: center; gap: 4px;
        }
        .tag-chip:hover { background: var(--button-secondary-hover); color: var(--text-strong); }
        .tag-chip.active { background: var(--surface-active); border-color: var(--border-strong); color: var(--text-strong); }
        .tag-chip .cnt { color: var(--text-faint); font-family: var(--font-display); font-size: var(--text-tiny); }
        .dash-tags .tag-detail {
            margin-top: 10px; padding-top: 8px;
            border-top: 1px solid var(--border-subtle);
            font-size: var(--text-meta); color: var(--text-tertiary);
            display: flex; align-items: center; justify-content: space-between;
            cursor: pointer; transition: color var(--dur-fast);
        }
        .dash-tags .tag-detail:hover { color: var(--text-secondary); }
        .dash-tags .tag-detail:hover .big { color: var(--action-primary); }
        .dash-tags .tag-detail .big {
            font-family: var(--font-display); font-size: 1.125rem; color: var(--text-strong);
        }
        .dash-empty {
            text-align: center; color: var(--text-faint);
            padding: 40px 0; font-size: var(--text-body);
            grid-column: 1 / -1;
        }

        /* 记录 Tab */
        #view-records {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0; /* 允许内部滚动 */
        }
        .input-section { margin-bottom: 10px; flex-shrink: 0; }
        .input-section textarea {
            width: 100%; height: 70px;
            background: var(--surface-field);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-field);
            color: var(--text-primary); padding: 10px 12px;
            font-size: var(--text-body); resize: none;
            font-family: inherit;
        }
        .input-section textarea::placeholder { color: var(--text-faint); }
        .input-section textarea:focus { border-color: var(--border-field); }
        .input-section .save-row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
        /* 主 CTA：赭橙 */
        .save-btn {
            padding: 6px 18px;
            background: var(--action-primary);
            color: var(--action-on-text); border: none; border-radius: var(--radius-btn);
            cursor: pointer; font-size: var(--text-body); font-weight: 600;
        }
        .save-btn:hover { background: var(--action-primary-hover); }
        #ai-preview-box {
            margin-top: 8px; padding: 8px 10px;
            background: rgba(212,115,75,0.08); border: 1px solid rgba(212,115,75,0.22);
            border-radius: var(--radius-field); font-size: var(--text-meta); display: none;
            color: var(--text-primary);
        }

        /* 待办列表 */
        .list-section { flex: 1; min-height: 0; overflow-y: auto; }
        /* 待办 tag 筛选条（从仪表盘 tag 芯片进入，action-first） */
        .filter-bar {
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            margin: 0 0 8px; padding: 6px 10px;
            background: var(--surface-chip); border: 1px solid var(--border-soft);
            border-radius: var(--radius-field);
            font-size: var(--text-meta); color: var(--text-secondary);
        }
        .filter-bar .filter-tag { color: var(--action-primary); font-weight: 600; }
        .filter-clear {
            background: transparent; color: var(--text-tertiary);
            border: 1px solid var(--border-soft); padding: 2px 10px; border-radius: var(--radius-field);
            font-size: var(--text-meta); cursor: pointer;
        }
        .filter-clear:hover { background: var(--button-secondary-hover); color: var(--text-strong); }
        .list-section h2 {
            font-size: var(--text-body); color: var(--text-tertiary);
            margin: 6px 0 8px; font-weight: var(--weight-strong);
            letter-spacing: 0.04em;
        }
        .entry-list { display: flex; flex-direction: column; gap: 6px; }
        .entry-item {
            background: var(--surface-card);
            border-radius: var(--radius-card); padding: 10px 12px;
            border-left: 2px solid transparent;
            border-bottom: 1px solid var(--border-subtle);
            transition: background var(--dur-fast);
        }
        .entry-item:hover { background: var(--surface-card-hover); }
        .entry-item.overdue { border-left-color: var(--status-danger); }
        .entry-item.today { border-left-color: var(--status-warning-strong); }
        .entry-item.note { border-left-color: var(--status-note); }
        .entry-item.done { border-left-color: var(--status-success); opacity: 0.62; }
        .entry-title { font-size: var(--text-body); margin-bottom: 4px; font-weight: var(--weight-strong); color: var(--text-strong); }
        .entry-meta { display: flex; gap: 8px; font-size: var(--text-meta); color: var(--text-tertiary); align-items: center; flex-wrap: wrap; }
        .entry-meta .due { color: var(--status-warning-strong); }
        .entry-meta .due.overdue { color: var(--status-danger-text); }
        .entry-meta .priority-high { color: var(--status-danger-text); }
        .entry-meta .priority-mid { color: var(--status-warning-strong); }
        .entry-meta .cat { padding: 1px 8px; border-radius: var(--radius-chip); background: var(--surface-chip); color: var(--text-secondary); }
        .entry-actions { margin-top: 6px; display: flex; gap: 8px; }
        .entry-actions button {
            background: transparent; color: var(--text-secondary);
            border: 1px solid var(--border-soft); padding: 3px 10px; border-radius: var(--radius-field);
            font-size: var(--text-meta); cursor: pointer;
        }
        .entry-actions button:hover { background: var(--button-secondary-hover); color: var(--text-strong); }
        .entry-actions .done-btn:hover { background: var(--status-success-bg); border-color: var(--status-success); }
        .entry-actions .promote-btn { color: var(--status-success-text); }
        .entry-actions .promote-btn:hover { background: rgba(111,168,107,0.16); border-color: var(--status-success); color: var(--status-success-text); }
        .empty { text-align: center; color: var(--text-faint); padding: 30px 0; font-size: var(--text-body); }

        /* 改期行（复用历史页 due-edit-row 视觉） */
        .due-edit-row { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
        .due-edit-row > .nsdp-mount { flex: 1; min-width: 0; display: flex; }
        .due-edit-row > .nsdp-mount .nsdp-field-wrap { width: 100%; }
        .due-edit-row > button {
            padding: 4px 10px; background: var(--action-primary); color: var(--action-on-text);
            border: none; border-radius: var(--radius-field); font-size: var(--text-meta); cursor: pointer; font-weight: 600;
            white-space: nowrap;
        }
        .due-edit-row > button:last-child { background: transparent; color: var(--text-secondary); border: 1px solid var(--border-soft); font-weight: 400; }

        /* 删除确认条（内联） */
        .confirm-bar {
            margin-top: 6px; display: flex; gap: 8px; align-items: center;
            font-size: var(--text-meta); color: var(--text-secondary);
        }
        .confirm-bar .confirm-btns { display: flex; gap: 6px; }
        .confirm-bar button {
            background: var(--status-danger); color: var(--text-strong);
            border: none; padding: 3px 10px; border-radius: var(--radius-field);
            font-size: var(--text-meta); cursor: pointer;
        }
        .confirm-bar button.confirm-no { background: transparent; color: var(--text-secondary); border: 1px solid var(--border-soft); }

        /* 对话 Tab */
        .chat-section {
            flex: 1;
            display: none;
            flex-direction: column;
            overflow: hidden;
            /* 左右留 6px：给 :focus-visible outline（2px + offset 2px）让位 */
            padding: 0 6px;
        }
        .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px; }
        .chat-msg { max-width: 85%; padding: 8px 12px; border-radius: var(--radius-card); font-size: var(--text-body); line-height: 1.5; white-space: pre-wrap; }
        .chat-msg.user { align-self: flex-end; background: rgba(212,115,75,0.16); border: 1px solid rgba(212,115,75,0.28); border-bottom-right-radius: 2px; }
        .chat-msg.ai { align-self: flex-start; background: var(--surface-card); border: 1px solid var(--border-subtle); border-bottom-left-radius: 2px; }
        .chat-input-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            /* 底部留出 focus outline 空间 */
            padding-bottom: 6px;
        }
        .chat-input-row input {
            flex: 1; background: var(--surface-field);
            border: 1px solid var(--border-soft); border-radius: var(--radius-field);
            color: var(--text-primary); padding: 9px 12px; font-size: var(--text-body);
        }
        .chat-input-row input::placeholder { color: var(--text-faint); }
        .chat-input-row input:focus { border-color: var(--border-field); }
        .chat-input-row button {
            padding: 8px 16px; background: var(--action-primary);
            color: var(--action-on-text); border: none; border-radius: var(--radius-btn); cursor: pointer; font-size: var(--text-body); font-weight: 600;
        }
        .chat-input-row button:hover { background: var(--action-primary-hover); }

        .footer { display: flex; gap: 8px; margin-top: 12px; border-top: 1px solid var(--border-subtle); padding-top: 12px; }
        .footer-button {
            flex: 1; padding: 8px 0;
            background: transparent; color: var(--text-tertiary);
            border: 1px solid var(--border-soft); border-radius: var(--radius-btn); cursor: pointer; font-size: var(--text-meta);
        }
        .footer-button:hover { background: var(--button-secondary-hover); color: var(--text-strong); }

        /* 拖拽条 */
        .drag-bar {
            position: absolute; top: 0; left: 0; right: 0; height: 24px;
            -webkit-app-region: drag; cursor: grab; border-radius: var(--radius-panel) var(--radius-panel) 0 0;
        }
        body { position: relative; }

        /* 设置面板 */
        #settings-overlay {
            position: fixed; inset: 0; z-index: 20;
            background: var(--surface-scrim);
            display: none;
            align-items: center;
            justify-content: center;
        }
        #settings-overlay.show { display: flex; }
        #settings-panel {
            width: 80%;
            max-width: 320px;
            background: var(--surface-raised);
            border-radius: var(--radius-panel);
            padding: 18px;
            border: 1px solid var(--border-soft);
            box-shadow: var(--shadow-dialog);
            transform-origin: center;
            animation: settings-in 0.2s ease-out;
        }
        @keyframes settings-in {
            from { transform: scale(0.97); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        #settings-panel h3 { font-family: var(--font-display); font-size: var(--text-title); font-weight: 500; margin-bottom: 14px; color: var(--text-strong); }
        .setting-row { margin-bottom: 14px; }
        .setting-row .label { font-size: var(--text-meta); color: var(--text-tertiary); margin-bottom: 6px; display: block; }
        .setting-row select, .setting-row input[type="number"] {
            width: 100%; padding: 7px 10px;
            background: var(--surface-field);
            color: var(--text-primary); border: 1px solid var(--border-soft);
            border-radius: var(--radius-field); font-size: var(--text-meta);
            color-scheme: dark;
        }
        /* 下拉选项强制暖黑底 */
        select option {
            background-color: #201e1c;
            color: #e8e4de;
        }
        .setting-row .switch-row { display: flex; align-items: center; justify-content: space-between; }
        .setting-row .desc { font-size: var(--text-meta); color: var(--text-faint); margin-top: 4px; }
        .switch {
            position: relative; width: 40px; height: 22px;
            background: var(--border-soft); border-radius: 11px;
            cursor: pointer; transition: background var(--dur-fast);
        }
        .switch.on { background: var(--action-on); }
        .switch::after {
            content: ''; position: absolute; top: 2px; left: 2px;
            width: 18px; height: 18px; border-radius: 50%;
            background: var(--text-strong); transition: transform var(--dur-fast);
        }
        .switch.on::after { transform: translateX(18px); }
        .switch:focus-visible { outline-offset: 3px; }
        .settings-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
        .settings-actions button {
            padding: 6px 14px; border-radius: var(--radius-btn);
            border: 1px solid var(--border-soft); cursor: pointer; font-size: var(--text-meta);
            background: transparent; color: var(--text-secondary);
        }
        .settings-actions button:hover { background: var(--button-secondary-hover); }
        .settings-actions button.primary { background: var(--action-primary); border-color: var(--action-primary); color: var(--action-on-text); font-weight: 600; }

        /* 无障碍：减少动态 */
        @media (prefers-reduced-motion: reduce) {
            .tab, .entry-item, .footer-button, .switch { transition: none; }
            #settings-panel { animation: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>nanoSecretary</h1>
            <span class="ai-status" id="ai-status">AI 连接中…</span>
        </div>

        <div class="tabs" role="tablist" aria-label="主视图">
            <button class="tab active" data-view="dashboard" id="view-tab-dashboard" role="tab" aria-selected="true"><span id="tab-dashboard-icon"></span>仪表盘</button>
            <button class="tab" data-view="records" id="view-tab-records" role="tab" aria-selected="false"><span id="tab-records-icon"></span>记录<span class="count" id="record-count"></span></button>
            <button class="tab" data-view="chat" id="view-tab-chat" role="tab" aria-selected="false"><span id="tab-chat-icon"></span>对话</button>
        </div>

        <!-- 仪表盘视图（bento，默认） -->
        <div id="view-dashboard" role="tabpanel" aria-labelledby="view-tab-dashboard">
            <div class="dash-row" id="dash-top-row">
                <!-- 今日总览环 -->
                <div class="dash-card" id="card-today">
                    <div class="card-label">今日</div>
                    <div class="ring-wrap" id="ring-today"></div>
                    <div class="next-todo" id="today-next" title="跳转到记录"></div>
                </div>
                <!-- 三色关注环：逾期 / 临近 / 近7天完成 -->
                <div class="dash-card" id="card-attention">
                    <div class="card-label">关注</div>
                    <div class="ring-wrap" id="ring-attention"></div>
                    <div class="legend" id="attention-legend"></div>
                </div>
                <!-- 本周完成进度环 -->
                <div class="dash-card" id="card-week">
                    <div class="card-label">本周完成</div>
                    <div class="ring-wrap" id="ring-week"></div>
                    <div class="dash-foot" id="week-foot"></div>
                </div>
            </div>
            <!-- tag 计数格 -->
            <div class="dash-tags" id="dash-tags">
                <div class="tags-label">标签待办</div>
                <div class="tag-chips" id="tag-chips"></div>
                <div class="tag-detail" id="tag-detail"></div>
            </div>
        </div>

        <!-- 记录视图 -->
        <div id="view-records" role="tabpanel" aria-labelledby="view-tab-records">
            <div class="input-section">
                <label for="input-text" class="visually-hidden" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">快速记录</label>
                <textarea id="input-text" placeholder="随手记：比如「下周三交季度报告 #工作」，AI 会自动识别截止日期…"></textarea>
                <div class="save-row">
                    <button class="save-btn" id="save-button" type="button">保存</button>
                    <span style="font-size: var(--text-meta);color: var(--text-faint)">Ctrl+Enter 保存</span>
                </div>
                <div id="ai-preview-box"></div>
            </div>

            <div class="list-section">
                <div class="filter-bar" id="todo-filter" hidden>
                    <span>筛选：<span class="filter-tag" id="todo-filter-tag"></span></span>
                    <button type="button" class="filter-clear" id="todo-filter-clear">清除</button>
                </div>
                <h2>待办事项</h2>
                <div class="entry-list" id="todo-list"></div>
                <h2 style="margin-top:12px;">最近记录</h2>
                <div class="entry-list" id="recent-list"></div>
            </div>
        </div>

        <!-- 对话视图 -->
        <div class="chat-section" id="view-chat" role="tabpanel" aria-labelledby="view-tab-chat">
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input-row">
                <label for="chat-input" class="visually-hidden" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">对话输入</label>
                <input type="text" id="chat-input" placeholder="问你的 nanoSecretary…（如：我今天有什么安排？）">
                <button id="chat-send" type="button">发送</button>
            </div>
        </div>

        <div class="footer">
            <button class="footer-button" id="history-button" type="button">历史记录</button>
            <button class="footer-button" id="sticky-button" type="button">便签</button>
            <button class="footer-button" id="settings-button" type="button">设置</button>
            <button class="footer-button" id="close-button" type="button">收起</button>
        </div>
    </div>

    <!-- 设置面板 -->
    <div id="settings-overlay" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div id="settings-panel">
            <h3 id="settings-title">设置</h3>
            <div class="setting-row">
                <label class="label" for="set-model">Ollama 模型</label>
                <select id="set-model"></select>
                <div class="desc" id="set-model-desc">未检测到本地模型</div>
            </div>
            <div class="setting-row">
                <label class="label" for="set-lead">提醒提前量（小时）</label>
                <input type="number" id="set-lead" min="0" max="168" value="24">
                <div class="desc">截止前多久开始提醒，0 = 仅当天提醒</div>
            </div>
            <div class="setting-row">
                <div class="switch-row">
                    <span class="label" style="margin:0;">AI 智能解析</span>
                    <div class="switch" id="set-ai-switch" role="switch" aria-checked="true" aria-label="AI 智能解析" tabindex="0"></div>
                </div>
                <div class="desc">关闭后仅保存文本，不做 AI 提取</div>
            </div>
            <div class="settings-actions">
                <button id="set-cancel" type="button">取消</button>
                <button class="primary" id="set-save" type="button">保存</button>
            </div>
        </div>
    </div>

    <script src="icons.js"></script>
    <!-- 日期选择器：react-day-picker 日历本体（构建产物）+ 原生封装 -->
    <script src="date-picker-react.js"></script>
    <script src="date-picker.js"></script>
    <script src="homepage.js"></script>
</body>
</html>
