<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
    <title>便签</title>
    <link rel="stylesheet" href="tokens.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }
        body {
            background: transparent;
            color: var(--text-primary);
            font-family: var(--font-stack);
            font-size: var(--text-body);
            overflow: hidden;
        }
        /* 无障碍：键盘焦点指示 —— 3px 橙 + 2px 留白（lshu 合同） */
        :focus-visible { outline: 3px solid var(--action-focus); outline-offset: 2px; border-radius: 0; }
        button, input, select, textarea { font-family: var(--font-stack); }
        .icon { display: inline-block; vertical-align: -2px; }

        /* 便签 = 一张贴在桌面上的纸：2px 主色框是它唯一的轮廓，
           没有圆角也没有投影（透明窗口浮在壁纸上，硬边比柔和影更读得出来） */
        .note {
            width: 100%;
            height: 100%;
            position: relative; /* 「选入已有任务」浮层的定位基准 */
            background: var(--surface-panel);
            border-radius: 0;
            border: 2px solid var(--border-strong);
            box-shadow: none;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* 拖拽条（窗口顶部 24px，-webkit-app-region drag） */
        .drag-bar {
            height: 24px;
            -webkit-app-region: drag;
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 6px;
            flex-shrink: 0;
            border-bottom: 2px solid var(--border-strong);
        }
        /* 左上角「选入已有任务」触发键（拖拽区内，要 no-drag） */
        .pick-btn {
            -webkit-app-region: no-drag;
            background: none; border: none; cursor: pointer;
            color: var(--text-tertiary); padding: 2px;
            display: inline-flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .pick-btn:hover { color: var(--text-strong); }
        /* 展开态 = 当前/选中 → 橙（lshu 里橙正是「当前」的语义） */
        .pick-btn[aria-expanded="true"] { color: var(--px-accent); }
        .drag-bar .title {
            font-size: var(--px-size);
            color: var(--text-tertiary);
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        .drag-bar .meta { font-size: var(--px-size); color: var(--text-faint); font-family: var(--font-display); }
        /* 置顶按钮在拖拽区内——app-region drag 子元素要 no-drag */
        .pin-btn {
            -webkit-app-region: no-drag;
            background: none; border: none; cursor: pointer;
            color: var(--text-faint); padding: 2px;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .pin-btn:hover { color: var(--text-strong); }
        .pin-btn.on { color: var(--px-accent); }

        .drag-bar .close-btn {
            -webkit-app-region: no-drag;
            background: none; border: none; cursor: pointer;
            color: var(--text-faint); padding: 2px;
            display: inline-flex; align-items: center; justify-content: center;
        }
        /* 图标是图形不是文字，按 3:1 判；橙在亮底 3.12:1、暗底 6.0:1 都过 */
        .drag-bar .close-btn:hover { color: var(--px-accent); }

        /* 标题输入：**用户自己写的内容**，走宋体不走点阵
           （lshu 明文禁止拿点阵字排长段中文；标题会写很长，也算正文） */
        .title-input {
            border: none; outline: none;
            background: transparent;
            color: var(--text-strong);
            font-family: var(--font-stack);
            font-size: var(--text-title);
            font-weight: var(--weight-strong);
            padding: 8px 14px 4px;
            width: 100%;
        }
        .title-input::placeholder { color: var(--text-faint); font-size: var(--text-body); font-weight: 400; }

        /* 正文 */
        .body-input {
            flex: 1;
            border: none; outline: none; resize: none;
            background: transparent;
            color: var(--text-primary);
            font-family: var(--font-stack);
            font-size: var(--text-body);
            line-height: 1.6;
            padding: 4px 14px 12px;
            width: 100%;
            min-height: 0;
        }
        .body-input::placeholder { color: var(--text-faint); }

        /* ---- 「选入已有任务」浮层 ----
           盖住拖拽条以下的内容区；窗口只有 240×230，扣掉拖拽条 24px
           与自身留白，实际可列约 5 行——够用，不做临时加高窗口。 */
        .pick-panel {
            position: absolute;
            top: 24px; left: 0; right: 0; bottom: 0;
            z-index: 5;
            background: var(--surface-panel);
            display: flex;
            flex-direction: column;
        }
        .pick-panel[hidden] { display: none; }
        .pick-filter {
            flex-shrink: 0;
            margin: 8px 10px 4px;
            padding: 3px 7px;
            font-size: var(--text-meta);
            color: var(--text-primary);
            background: var(--surface-field);
            border: 2px solid var(--border-strong);
            border-radius: 0;
            outline: none;
        }
        .pick-filter:focus { border-color: var(--border-field); }
        .pick-filter::placeholder { color: var(--text-faint); }
        .pick-list { flex: 1; min-height: 0; overflow-y: auto; padding: 0 6px 8px; }
        .pick-item {
            display: flex; align-items: center; gap: 8px;
            padding: 5px 8px;
            border-radius: 0;
            cursor: pointer;
            font-size: var(--text-meta);
            color: var(--text-primary);
        }
        .pick-item .box {
            flex-shrink: 0;
            width: 14px; height: 14px;
            border: 1px solid var(--border-strong);
            border-radius: 0;
            display: inline-flex; align-items: center; justify-content: center;
            color: transparent; /* 未选中时勾隐藏 */
        }
        /* 14px 的框里放 12px 图标（点阵原生网格） */
        .pick-item .box .icon { width: 12px; height: 12px; }
        .pick-item[data-checked="true"] .box {
            background: var(--action-primary);
            border-color: var(--action-primary);
            color: var(--action-on-text); /* 橙底深墨勾，不是白勾（暗色下白压橙 2.84:1） */
        }
        .pick-item .t { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .pick-item .d { flex-shrink: 0; color: var(--text-faint); font-size: var(--px-size); font-family: var(--font-display); }
        /* 键盘高亮行整条填橙，行内所有字（含右侧日期）都得换成深墨 */
        .pick-item[data-active="true"] { background: var(--surface-active); color: var(--action-on-text); }
        .pick-item[data-active="true"] .d { color: var(--action-on-text); }
        /* 高亮行上的方框：底色也是橙，黑框会整块糊掉，改描深墨 */
        .pick-item[data-active="true"] .box { border-color: var(--action-on-text); }
        .pick-empty { padding: 14px 8px; text-align: center; color: var(--text-faint); font-size: var(--text-meta); }

        .status-bar {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 14px 8px;
            font-size: var(--px-size);
            color: var(--text-faint);
        }
        .status-bar .save-state { display: inline-flex; align-items: center; gap: 4px; }
        /* 11px 会把 24 格图标重采样；12px 才是 1× */
        .status-bar .save-state .icon { width: 12px; height: 12px; }
    </style>
</head>
<body>
    <div class="note">
        <div class="drag-bar">
            <button class="pick-btn" id="pick-btn" type="button" title="选入已有任务" aria-label="选入已有任务" aria-expanded="false" aria-controls="pick-panel"></button>
            <span class="title">便签</span>
            <span class="meta" id="note-date"></span>
            <button class="pin-btn" id="pin-btn" type="button" title="置顶切换" aria-label="置顶切换"></button>
            <button class="close-btn" id="close-btn" type="button" title="收起" aria-label="收起便签"></button>
        </div>
        <input class="title-input" id="note-title" type="text" placeholder="便签标题（可选）">
        <textarea class="body-input" id="note-body" placeholder="记点什么…"></textarea>
        <div class="status-bar">
            <span class="save-state" id="save-state"></span>
            <span id="char-count"></span>
        </div>

        <div class="pick-panel" id="pick-panel" hidden>
            <input class="pick-filter" id="pick-filter" type="text" placeholder="筛选任务…"
                   role="combobox" aria-label="筛选任务" aria-expanded="true"
                   aria-controls="pick-list" aria-autocomplete="list">
            <div class="pick-list" id="pick-list" role="listbox" aria-multiselectable="true" aria-label="可选的待办任务"></div>
        </div>
    </div>
    <script src="icons.js"></script>
    <script src="notes.js"></script>
</body>
</html>
