<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 内容安全策略：仅本机脚本；样式允许内联（无构建工具链） -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
    <title>nanoSecretary</title>
    <style>
        /* 根字号基准：1rem = 16px，布局随系统字号缩放 */
        html { font-size: 100%; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: transparent;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        }

        /* 无障碍：键盘焦点指示（全局，浅色描边 + 外发光） */
        :focus-visible {
            outline: 2px solid rgba(120, 180, 255, 0.9);
            outline-offset: 2px;
            border-radius: 4px;
        }
        .tab:focus-visible,
        #save-button:focus-visible,
        #save-button-form:focus-visible {
            outline-offset: 1px;
        }

        /* ---- 悬浮球 ---- */
        /* 外层：透明点击区，负责 hover/按下反馈（transform 不被动画占用） */
        #floating-ball {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            user-select: none;
            -webkit-app-region: no-drag;
            transition: transform 0.2s ease-out;
            touch-action: none;
            background: transparent;
            border: none;
            padding: 0;
        }
        #floating-ball:hover { transform: scale(1.08); }
        #floating-ball:active { transform: scale(0.94); }
        /* 内层：承载全部可视材质 + 呼吸/脉冲动画；透明背景时靠 box-shadow 形成点击区 */
        #ball-core {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            pointer-events: none;
            /* 基础材质：垂直渐变 + 左上径向高光，模拟有光泽的玻璃球 */
            background:
                radial-gradient(circle at 32% 28%, rgba(255,255,255,0.55), rgba(255,255,255,0) 42%),
                linear-gradient(135deg, rgba(135,145,165,0.95), rgba(75,85,105,0.95));
            box-shadow:
                0 3px 14px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255,255,255,0.35),
                inset 0 -2px 6px rgba(0,0,0,0.18);
            transition: background 0.5s ease, box-shadow 0.5s ease;
            will-change: transform;
        }
        /* 常驻呼吸动画（缩放内层材质） */
        #floating-ball.breathe #ball-core { animation: breathe 2.4s ease-in-out infinite; }
        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        /* 有截止提醒：常驻橙色呼吸（内层背景平滑过渡到橙色） */
        #floating-ball.due #ball-core {
            background:
                radial-gradient(circle at 32% 28%, rgba(255,255,255,0.5), rgba(255,255,255,0) 42%),
                linear-gradient(135deg, rgba(255,168,68,0.98), rgba(228,112,42,0.98));
            animation: breathe 1.8s ease-in-out infinite;
        }
        /* 临近截止：红色急促脉冲 */
        #floating-ball.urgent #ball-core {
            background:
                radial-gradient(circle at 32% 28%, rgba(255,255,255,0.5), rgba(255,255,255,0) 42%),
                linear-gradient(135deg, rgba(255,100,88,0.98), rgba(218,52,52,0.98));
            animation: pulse 1.2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,90,80,0.55); }
            50% { transform: scale(1.08); box-shadow: 0 0 0 10px rgba(255,90,80,0); }
        }

        /* 角标：待办数量 */
        #badge {
            position: absolute;
            top: -2px;
            right: -2px;
            min-width: 16px;
            height: 16px;
            padding: 0 4px;
            border-radius: 8px;
            background: #e5484d;
            color: white;
            font-size: 0.625rem;
            font-weight: 700;
            display: none;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.6);
        }
        /* 保存成功：内层材质绿色闪光 */
        #floating-ball.saved #ball-core {
            background:
                radial-gradient(circle at 32% 28%, rgba(255,255,255,0.5), rgba(255,255,255,0) 42%),
                linear-gradient(135deg, rgba(80,200,130,0.98), rgba(50,160,100,0.98));
            animation: flash-save 0.5s ease-out;
        }
        @keyframes flash-save {
            0% { transform: scale(0.6); opacity: 0.4; }
            30% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* ---- 输入面板 ---- */
        #input-container {
            display: none;
            width: 100%;
            height: 100%;
            padding: 8px;
        }
        #input-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: rgba(28, 28, 32, 0.9);
            backdrop-filter: blur(18px) saturate(160%);
            border-radius: 14px;
            padding: 10px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4),
                        inset 0 1px 0 rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.09);
            transform-origin: 50% 100%; /* 从底部(球的方向)展开 */
            opacity: 0;
            transform: scale(0.92);
            transition: opacity 0.18s ease-out, transform 0.22s cubic-bezier(0.2, 0.9, 0.3, 1.2), backdrop-filter 0.22s ease-out;
            will-change: transform, opacity;
        }
        #input-wrapper.show {
            opacity: 1;
            transform: scale(1);
            backdrop-filter: blur(18px) saturate(180%);
        }
        #text-input {
            flex: 1;
            width: 100%;
            border: none;
            background: rgba(255,255,255,0.08);
            color: white;
            padding: 0 12px;
            border-radius: 8px;
            font-size: 0.875rem;
            outline: none;
            margin-bottom: 8px;
        }
        #text-input::placeholder { color: rgba(255,255,255,0.55); }

        /* 保存失败内联提示 */
        #save-error {
            display: none;
            color: #ff8b8b;
            font-size: 0.6875rem;
            margin-top: 6px;
            padding: 5px 8px;
            border-radius: 6px;
            background: rgba(255,90,90,0.12);
        }

        .row { display: flex; gap: 6px; align-items: center; }
        .row select, .row input[type="date"] {
            background: rgba(255,255,255,0.1);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 5px 8px;
            font-size: 0.75rem;
            outline: none;
            color-scheme: dark;
        }
        .row input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8); }
        .row label { color: rgba(255,255,255,0.6); font-size: 0.6875rem; }

        #save-button,
        #save-button-form {
            height: 30px;
            padding: 0 16px;
            background: linear-gradient(135deg, rgba(120,130,150,0.9), rgba(80,88,104,0.9));
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8125rem;
            transition: filter 0.2s;
            margin-left: auto;
        }
        #save-button:hover,
        #save-button-form:hover { filter: brightness(1.15); }

        /* AI 解析结果预览 */
        #ai-preview {
            display: none;
            background: rgba(120,180,255,0.1);
            border: 1px solid rgba(120,180,255,0.25);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.85);
            margin-bottom: 8px;
            line-height: 1.5;
        }
        #ai-preview .ai-title { font-weight: 600; }
        #ai-preview .ai-edit {
            float: right;
            background: none;
            border: none;
            color: rgba(120,180,255,0.9);
            cursor: pointer;
            font-size: 0.6875rem;
        }

        /* 模式切换 Tab */
        .tabs { display: flex; gap: 4px; margin-bottom: 8px; }
        .tab {
            padding: 3px 10px;
            font-size: 0.6875rem;
            border-radius: 20px;
            background: rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.65);
            border: none;
            cursor: pointer;
        }
        .tab.active { background: rgba(120,180,255,0.25); color: white; }

        .form-row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
        .form-row input[type="text"], .form-row input[type="date"] {
            flex: 1;
            background: rgba(255,255,255,0.08);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 0.75rem;
            outline: none;
        }
        .form-row select {
            background: rgba(255,255,255,0.1);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 0.75rem;
            color-scheme: dark;
        }
        /* 输入面板子面板：内容多时内部滚动，防溢出窗口 */
        #quick-panel, #form-panel {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
        }
        /* 下拉选项强制黑底白字，避免系统原生白底白字 */
        select option {
            background-color: #1e1e24;
            color: white;
        }
        #overlay { position: fixed; inset: 0; background: transparent; display: none; z-index: -1; }

        .hint { color: rgba(255,255,255,0.5); font-size: 0.625rem; margin-top: 6px; text-align: center; }

        /* ---- 无障碍：减少动态 ---- */
        /* prefers-reduced-motion: 停用呼吸/脉冲/闪光动画，保留颜色状态提示（静态即可） */
        @media (prefers-reduced-motion: reduce) {
            #floating-ball.breathe #ball-core,
            #floating-ball.due #ball-core,
            #floating-ball.urgent #ball-core,
            #floating-ball.saved #ball-core {
                animation: none;
            }
            #floating-ball:hover { transform: none; }
            #floating-ball:active { transform: scale(0.97); }
            /* 面板进入改为极淡透明度过渡，不做位移缩放 */
            #input-wrapper {
                transition: opacity 0.15s ease-out;
                transform: none;
            }
        }
        /* prefers-reduced-transparency: 降毛玻璃模糊，提高底色不透明度，保证可读性 */
        @media (prefers-reduced-transparency: reduce) {
            #input-wrapper {
                background: rgba(28, 28, 32, 0.98);
                backdrop-filter: blur(4px);
            }
        }
    </style>
</head>
<body>
    <!-- 悬浮球：role="button" + tabindex，键盘可操作（Enter/Space 打开输入面板） -->
    <div id="floating-ball" role="button" tabindex="0" aria-label="打开速记输入" title="双击输入">
        <div id="ball-core"></div>
        <span id="ball-icon" style="position:relative;color:white;font-size: 1.125rem;pointer-events:none;">◆</span>
        <span id="badge">0</span>
    </div>

    <div id="input-container">
        <div id="input-wrapper" role="group" aria-label="速记输入面板">
            <div class="tabs" role="tablist" aria-label="输入方式">
                <button class="tab active" id="tab-quick" data-mode="quick" role="tab" aria-selected="true">快速记录</button>
                <button class="tab" id="tab-form" data-mode="form" role="tab" aria-selected="false">结构化</button>
            </div>

            <!-- 快速记录模式 -->
            <div id="quick-panel" role="tabpanel" aria-labelledby="tab-quick">
                <div id="ai-preview"></div>
                <input type="text" id="text-input" placeholder="随手记，AI 会自动识别截止日期 #标签" autocomplete="off">
                <div class="row">
                    <button id="save-button" type="button">保存</button>
                </div>
                <div id="save-error" role="status">保存失败，请重试</div>
            </div>

            <!-- 结构化表单模式 -->
            <div id="form-panel" style="display:none;" role="tabpanel" aria-labelledby="tab-form">
                <div class="form-row">
                    <label for="f-title" class="visually-hidden" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">要做什么</label>
                    <input type="text" id="f-title" placeholder="要做什么？" autocomplete="off">
                </div>
                <div class="form-row">
                    <label for="f-due" class="visually-hidden" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">截止日期</label>
                    <input type="date" id="f-due">
                    <label for="f-priority" class="visually-hidden" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">优先级</label>
                    <select id="f-priority">
                        <option value="低">低</option>
                        <option value="中" selected>中</option>
                        <option value="高">高</option>
                    </select>
                </div>
                <div class="row">
                    <button id="save-button-form" type="button">保存</button>
                </div>
            </div>

            <div class="hint">Esc 收起 · Enter 保存 · 右键更多</div>
        </div>
    </div>
    <div id="overlay"></div>

    <script src="index.js"></script>
</body>
</html>
