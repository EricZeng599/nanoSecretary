<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>赛博秘书</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: transparent;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        }

        /* ---- 悬浮球 ---- */
        #floating-ball {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(120,130,150,0.85), rgba(80,88,104,0.85));
            transition: transform 0.25s ease, background 0.3s ease;
            cursor: pointer;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            color: white;
            font-size: 18px;
            user-select: none;
            -webkit-app-region: no-drag;
        }
        #floating-ball:hover { transform: scale(1.1); }
        #floating-ball:active { transform: scale(0.95); }
        #floating-ball.due { background: linear-gradient(135deg, rgba(255,160,60,0.95), rgba(230,110,40,0.95)); }
        #floating-ball.urgent { background: linear-gradient(135deg, rgba(255,90,80,0.95), rgba(220,50,50,0.95)); animation: pulse 1.2s infinite; }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,90,80,0.5); }
            50% { transform: scale(1.12); box-shadow: 0 0 0 10px rgba(255,90,80,0); }
        }

        /* 角标：待办数量 */
        #badge {
            position: absolute;
            top: -2px;
            right: -2px;
            min-width: 16px;
            height: 16px;
            padding: 0 4px;
            border-radius: 8px;
            background: #e5484d;
            color: white;
            font-size: 10px;
            font-weight: 700;
            display: none;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.6);
        }

        /* ---- 输入面板 ---- */
        #input-container {
            display: none;
            width: 100%;
            height: 100%;
            padding: 8px;
        }
        #input-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: rgba(28, 28, 32, 0.92);
            backdrop-filter: blur(14px);
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255,255,255,0.08);
        }
        #text-input {
            flex: 1;
            width: 100%;
            border: none;
            background: rgba(255,255,255,0.08);
            color: white;
            padding: 0 12px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            margin-bottom: 8px;
        }
        #text-input::placeholder { color: rgba(255,255,255,0.45); }

        .row { display: flex; gap: 6px; align-items: center; }
        .row select, .row input[type="date"] {
            background: rgba(255,255,255,0.1);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 5px 8px;
            font-size: 12px;
            outline: none;
            color-scheme: dark;
        }
        .row input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8); }
        .row label { color: rgba(255,255,255,0.5); font-size: 11px; }

        #save-button {
            height: 30px;
            padding: 0 16px;
            background: linear-gradient(135deg, rgba(120,130,150,0.9), rgba(80,88,104,0.9));
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: filter 0.2s;
            margin-left: auto;
        }
        #save-button:hover { filter: brightness(1.15); }

        /* AI 解析结果预览 */
        #ai-preview {
            display: none;
            background: rgba(120,180,255,0.1);
            border: 1px solid rgba(120,180,255,0.25);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 12px;
            color: rgba(255,255,255,0.85);
            margin-bottom: 8px;
            line-height: 1.5;
        }
        #ai-preview .ai-title { font-weight: 600; }
        #ai-preview .ai-edit {
            float: right;
            background: none;
            border: none;
            color: rgba(120,180,255,0.9);
            cursor: pointer;
            font-size: 11px;
        }

        /* 模式切换 Tab */
        .tabs { display: flex; gap: 4px; margin-bottom: 8px; }
        .tab {
            padding: 3px 10px;
            font-size: 11px;
            border-radius: 20px;
            background: rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.55);
            border: none;
            cursor: pointer;
        }
        .tab.active { background: rgba(120,180,255,0.25); color: white; }

        .form-row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
        .form-row input[type="text"], .form-row input[type="date"] {
            flex: 1;
            background: rgba(255,255,255,0.08);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 12px;
            outline: none;
        }
        .form-row select {
            background: rgba(255,255,255,0.1);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 12px;
        }
        #overlay { position: fixed; inset: 0; background: transparent; display: none; z-index: -1; }

        .hint { color: rgba(255,255,255,0.35); font-size: 10px; margin-top: 6px; text-align: center; }
    </style>
</head>
<body>
    <div id="floating-ball" title="双击输入">
        <span id="ball-icon">◆</span>
        <span id="badge">0</span>
    </div>

    <div id="input-container">
        <div id="input-wrapper">
            <div class="tabs">
                <button class="tab active" id="tab-quick" data-mode="quick">快速记录</button>
                <button class="tab" id="tab-form" data-mode="form">结构化</button>
            </div>

            <!-- 快速记录模式 -->
            <div id="quick-panel">
                <div id="ai-preview"></div>
                <input type="text" id="text-input" placeholder="随手记，AI 会自动识别截止日期 #标签" autocomplete="off">
                <div class="row">
                    <button id="save-button">保存</button>
                </div>
            </div>

            <!-- 结构化表单模式 -->
            <div id="form-panel" style="display:none;">
                <div class="form-row">
                    <input type="text" id="f-title" placeholder="要做什么？" autocomplete="off">
                </div>
                <div class="form-row">
                    <input type="date" id="f-due">
                    <select id="f-priority">
                        <option value="低">低</option>
                        <option value="中" selected>中</option>
                        <option value="高">高</option>
                    </select>
                </div>
                <div class="row">
                    <button id="save-button-form" style="margin-left:auto;">保存</button>
                </div>
            </div>

            <div class="hint">Esc 收起 · Enter 保存 · 右键更多</div>
        </div>
    </div>
    <div id="overlay"></div>

    <script>
        const api = window.api;
        const ball = document.getElementById('floating-ball');
        const badge = document.getElementById('badge');
        const inputContainer = document.getElementById('input-container');
        const quickPanel = document.getElementById('quick-panel');
        const formPanel = document.getElementById('form-panel');
        const textInput = document.getElementById('text-input');
        const saveButton = document.getElementById('save-button');
        const saveButtonForm = document.getElementById('save-button-form');
        const aiPreview = document.getElementById('ai-preview');
        const overlay = document.getElementById('overlay');

        let currentMode = 'ball';
        let entryMode = 'quick';
        let pendingAiPreview = null; // AI 解析结果，用户确认后保存

        // 拖拽（增量模式：mousedown 通知主进程记起点，mousemove 只上报位移）
        let isDragging = false;
        let dragStartX = 0, dragStartY = 0;

        // 初始化
        inputContainer.style.display = 'none';
        ball.style.display = 'flex';

        // Tab 切换
        document.getElementById('tab-quick').addEventListener('click', () => setEntryMode('quick'));
        document.getElementById('tab-form').addEventListener('click', () => setEntryMode('form'));
        function setEntryMode(mode) {
            entryMode = mode;
            document.getElementById('tab-quick').classList.toggle('active', mode === 'quick');
            document.getElementById('tab-form').classList.toggle('active', mode === 'form');
            quickPanel.style.display = mode === 'quick' ? 'block' : 'none';
            formPanel.style.display = mode === 'form' ? 'block' : 'none';
            if (mode === 'quick') textInput.focus();
            else document.getElementById('f-title').focus();
        }

        // 双击进入输入模式
        ball.addEventListener('dblclick', () => {
            if (currentMode === 'ball') switchToInputMode();
        });

        // 拖拽：悬浮球
        ball.addEventListener('mousedown', (e) => {
            if (e.button === 0 && currentMode === 'ball') {
                isDragging = true;
                dragStartX = e.screenX;
                dragStartY = e.screenY;
                api.dragStart();
            }
        });
        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                api.dragMove(e.screenX - dragStartX, e.screenY - dragStartY);
            }
        });
        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                api.dragEnd();
            }
        });

        // 右键菜单
        ball.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            api.showBallMenu(e.clientX, e.clientY);
        });

        // Esc 返回小球
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && currentMode === 'input') switchToBallMode();
        });

        // 输入面板拖拽（增量模式）
        let isInputDragging = false, inputDragX = 0, inputDragY = 0;
        inputContainer.addEventListener('mousedown', (e) => {
            if (currentMode !== 'input') return;
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'BUTTON') return;
            isInputDragging = true;
            inputDragX = e.screenX;
            inputDragY = e.screenY;
            api.dragStart();
        });
        document.addEventListener('mousemove', (e) => {
            if (isInputDragging) {
                api.dragMove(e.screenX - inputDragX, e.screenY - inputDragY);
            }
        });
        document.addEventListener('mouseup', () => {
            if (isInputDragging) {
                isInputDragging = false;
                api.dragEnd();
            }
        });

        // 快速记录：输入时实时 AI 预览（防抖）
        let aiTimer = null;
        textInput.addEventListener('input', () => {
            clearTimeout(aiTimer);
            const text = textInput.value.trim();
            if (!text) { aiPreview.style.display = 'none'; pendingAiPreview = null; return; }
            aiTimer = setTimeout(() => {
                // 调主进程做 AI 解析预览
                api.saveEntryPreview && api.saveEntryPreview(text);
            }, 800);
        });
        api.onAiPreview && api.onAiPreview((preview) => {
            if (!preview) return;
            pendingAiPreview = preview;
            aiPreview.innerHTML = '';
            const title = document.createElement('div');
            title.className = 'ai-title';
            title.textContent = (preview.type === 'task' ? '📌 ' : '📝 ') + (preview.title || '');
            const meta = document.createElement('div');
            meta.textContent = [preview.dueDate ? ('截止 ' + preview.dueDate) : '', preview.priority ? '优先级·' + preview.priority : '', preview.category ? preview.category : ''].filter(Boolean).join(' · ');
            aiPreview.appendChild(title);
            if (meta.textContent) aiPreview.appendChild(meta);
            aiPreview.style.display = 'block';
        });

        // 保存（快速记录）
        saveButton.addEventListener('click', saveQuick);
        textInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') saveQuick(); });
        function saveQuick() {
            const text = textInput.value.trim();
            if (!text) return;
            api.saveEntry(text);
            textInput.value = '';
            aiPreview.style.display = 'none';
            pendingAiPreview = null;
            switchToBallMode();
        }

        // 保存（结构化表单）
        saveButtonForm.addEventListener('click', saveForm);
        function saveForm() {
            const title = document.getElementById('f-title').value.trim();
            const due = document.getElementById('f-due').value;
            const priority = document.getElementById('f-priority').value;
            if (!title) { document.getElementById('f-title').focus(); return; }
            let payload = title;
            if (due) payload += ' 截止' + due;
            payload += ' 优先级' + priority;
            api.saveEntry(payload);
            document.getElementById('f-title').value = '';
            document.getElementById('f-due').value = '';
            switchToBallMode();
        }

        // 保存结果
        api.onSaveSuccess((data) => {
            if (!data || !data.ok) { alert('保存失败，请重试'); return; }
            // 若 AI 后续解析出了截止日期，悬浮球进入"待办"状态
        });
        api.onAiRefined((entry) => {
            if (entry && entry.status === 'pending') updateBallStatus(true);
        });

        // 提醒状态（主进程推送）
        api.onReminderAlert((data) => {
            if (data && data.hasDue) updateBallStatus(true);
        });

        function updateBallStatus(hasDue) {
            ball.classList.add('due');
            badge.style.display = 'flex';
        }

        // 模式切换
        function switchToInputMode() {
            currentMode = 'input';
            api.resizeWindow('input');
            ball.style.display = 'none';
            inputContainer.style.display = 'flex';
            setEntryMode(entryMode);
            setTimeout(() => {
                if (entryMode === 'quick') textInput.focus();
                else document.getElementById('f-title').focus();
            }, 120);
        }
        function switchToBallMode() {
            currentMode = 'ball';
            api.resizeWindow('ball');
            inputContainer.style.display = 'none';
            ball.style.display = 'flex';
        }
    </script>
</body>
</html>
