<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 内容安全策略：仅本机脚本；样式允许内联（无构建工具链） -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
    <title>nanoSecretary</title>
    <link rel="stylesheet" href="tokens.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        /* html 需占满窗口高度，body 的 height:100% 才有依据；
           否则 body 收缩到内容高度，球不居中，呼吸动画顶部溢出被裁 */
        html, body { width: 100%; height: 100%; }
        body {
            background: transparent;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: var(--font-stack);
        }

        /* 无障碍：键盘焦点指示（赭橙） */
        :focus-visible {
            outline: 2px solid var(--action-focus);
            outline-offset: 2px;
            border-radius: 2px;
        }
        .tab:focus-visible,
        #save-button:focus-visible,
        #save-button-form:focus-visible {
            outline-offset: 1px;
        }

        /* 统一线性图标 */
        .icon { display: inline-block; vertical-align: -2px; }

        /* ---- 悬浮球 ---- */
        /* 外层：透明点击区，负责 hover/按下反馈 */
        #floating-ball {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            user-select: none;
            -webkit-app-region: no-drag;
            transition: transform var(--dur-med) var(--ease-out);
            touch-action: none;
            background: transparent;
            border: none;
            padding: 0;
        }
        #floating-ball:hover { transform: scale(1.08); }
        #floating-ball:active { transform: scale(0.94); }
        /* 内层：暖灰玻璃球（无冷蓝） */
        #ball-core {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            pointer-events: none;
            background: var(--surface-ball);
            box-shadow: var(--shadow-ball);
            transition: background 0.5s ease, box-shadow 0.5s ease;
        }
        /* 常驻呼吸动画 */
        #floating-ball.breathe #ball-core { animation: breathe 2.4s ease-in-out infinite; }
        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        /* 有截止提醒：暖橙呼吸 */
        #floating-ball.due #ball-core {
            background: linear-gradient(135deg, #d4734b, #b05e38);
            animation: breathe 1.8s ease-in-out infinite;
        }
        /* 临近截止：红脉冲 */
        #floating-ball.urgent #ball-core {
            background: linear-gradient(135deg, #c53a2c, #9e2d22);
            animation: pulse 1.2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(197,58,44,0.5); }
            50% { transform: scale(1.08); box-shadow: 0 0 0 10px rgba(197,58,44,0); }
        }

        /* 角标：待办数量 */
        #badge {
            position: absolute;
            top: -2px;
            right: -2px;
            min-width: 16px;
            height: 16px;
            padding: 0 4px;
            border-radius: 8px;
            background: var(--status-danger);
            color: #fff;
            font-size: var(--text-tiny);
            font-weight: 700;
            display: none;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.5);
        }
        /* 保存成功：暖绿闪光 */
        #floating-ball.saved #ball-core {
            background: linear-gradient(135deg, #6fa86b, #4c8048);
            animation: flash-save 0.5s ease-out;
        }
        @keyframes flash-save {
            0% { transform: scale(0.6); opacity: 0.4; }
            30% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* ---- 输入面板（极简 editorial） ---- */
        #input-container {
            display: none;
            width: 100%;
            height: 100%;
            padding: 6px;
        }
        #input-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--surface-panel);
            border-radius: var(--radius-panel);
            padding: 12px;
            box-shadow: var(--shadow-panel);
            border: 1px solid var(--border-soft);
            transform-origin: 50% 100%;
            opacity: 0;
            transform: scale(0.96);
            transition: opacity 0.18s ease-out, transform 0.22s var(--ease-out);
        }
        #input-wrapper.show {
            opacity: 1;
            transform: scale(1);
        }
        #text-input {
            flex: 1;
            width: 100%;
            border: none;
            border-bottom: 1px solid var(--border-soft);
            background: transparent;
            color: var(--text-primary);
            padding: 4px 2px 8px;
            border-radius: 0;
            font-size: var(--text-body);
            outline: none;
            margin-bottom: 8px;
        }
        #text-input:focus { border-bottom-color: var(--border-field); }
        #text-input::placeholder { color: var(--text-faint); }

        /* 保存失败内联提示 */
        #save-error {
            display: none;
            color: var(--status-danger-text);
            font-size: var(--text-meta);
            margin-top: 6px;
            padding: 4px 8px;
            border-radius: var(--radius-field);
            background: var(--status-danger-bg);
        }

        .row { display: flex; gap: 6px; align-items: center; }
        .row select, .row input[type="date"] {
            background: var(--surface-field);
            color: var(--text-primary);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-field);
            padding: 5px 8px;
            font-size: var(--text-meta);
            outline: none;
            color-scheme: dark;
        }
        .row input[type="date"]:focus { border-color: var(--border-field); }
        .row input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.75); }
        .row label { color: var(--text-tertiary); font-size: var(--text-meta); }

        /* 次级保存按钮（输入面板）：极简描边 */
        #save-button,
        #save-button-form {
            height: 30px;
            padding: 0 16px;
            background: var(--action-primary);
            color: var(--action-on-text);
            border: none;
            border-radius: var(--radius-btn);
            cursor: pointer;
            font-size: var(--text-body);
            font-weight: 600;
            margin-left: auto;
        }
        #save-button:hover,
        #save-button-form:hover { background: var(--action-primary-hover); }

        /* AI 解析结果预览 */
        #ai-preview {
            display: none;
            background: rgba(212,115,75,0.08);
            border: 1px solid rgba(212,115,75,0.22);
            border-radius: var(--radius-field);
            padding: 8px 10px;
            font-size: var(--text-meta);
            color: var(--text-primary);
            margin-bottom: 8px;
            line-height: 1.5;
        }
        #ai-preview .ai-title { font-weight: var(--weight-strong); }
        #ai-preview .ai-edit {
            float: right;
            background: none;
            border: none;
            color: var(--action-on-strong);
            cursor: pointer;
            font-size: var(--text-meta);
        }

        /* 模式切换 Tab（极简下划线式） */
        .tabs { display: flex; gap: 4px; margin-bottom: 8px; border-bottom: 1px solid var(--border-subtle); }
        .tab {
            padding: 3px 10px 6px;
            font-size: var(--text-meta);
            border: none;
            background: transparent;
            color: var(--text-tertiary);
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            cursor: pointer;
            transition: color var(--dur-fast), border-color var(--dur-fast);
        }
        .tab:hover { color: var(--text-secondary); }
        .tab.active { color: var(--text-strong); border-bottom-color: var(--action-primary); }

        .form-row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
        .form-row input[type="text"], .form-row input[type="date"] {
            flex: 1;
            background: var(--surface-field);
            color: var(--text-primary);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-field);
            padding: 6px 10px;
            font-size: var(--text-meta);
            outline: none;
        }
        .form-row input:focus { border-color: var(--border-field); }
        .form-row select {
            background: var(--surface-field);
            color: var(--text-primary);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-field);
            padding: 6px 8px;
            font-size: var(--text-meta);
            color-scheme: dark;
        }
        /* 输入面板子面板 */
        #quick-panel, #form-panel {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
        }
        /* 下拉选项强制暖黑底 */
        select option {
            background-color: #201e1c;
            color: #e8e4de;
        }

        .hint { color: var(--text-faint); font-size: var(--text-meta); margin-top: 6px; text-align: center; }

        /* ---- 无障碍：减少动态 ---- */
        @media (prefers-reduced-motion: reduce) {
            #floating-ball.breathe #ball-core,
            #floating-ball.due #ball-core,
            #floating-ball.urgent #ball-core,
            #floating-ball.saved #ball-core {
                animation: none;
            }
            #floating-ball:hover { transform: none; }
            #floating-ball:active { transform: scale(0.97); }
            #input-wrapper {
                transition: opacity 0.15s ease-out;
                transform: none;
            }
        }
    </style>
</head>
<body>
    <!-- 悬浮球：role="button" + tabindex，键盘可操作 -->
    <div id="floating-ball" role="button" tabindex="0" aria-label="打开速记输入" title="双击输入">
        <div id="ball-core"></div>
        <span id="ball-icon" style="position:relative;color:white;font-size: 1.125rem;pointer-events:none;line-height:0;"></span>
        <span id="badge">0</span>
    </div>

    <div id="input-container">
        <div id="input-wrapper" role="group" aria-label="速记输入面板">
            <div class="tabs" role="tablist" aria-label="输入方式">
                <button class="tab active" id="tab-quick" data-mode="quick" role="tab" aria-selected="true">快速记录</button>
                <button class="tab" id="tab-form" data-mode="form" role="tab" aria-selected="false">结构化</button>
            </div>

            <!-- 快速记录模式 -->
            <div id="quick-panel" role="tabpanel" aria-labelledby="tab-quick">
                <div id="ai-preview"></div>
                <input type="text" id="text-input" placeholder="随手记，AI 会自动识别截止日期 #标签" autocomplete="off">
                <div class="row">
                    <button id="save-button" type="button">保存</button>
                </div>
                <div id="save-error" role="status">保存失败，请重试</div>
            </div>

            <!-- 结构化表单模式 -->
            <div id="form-panel" style="display:none;" role="tabpanel" aria-labelledby="tab-form">
                <div class="form-row">
                    <label for="f-title" class="visually-hidden" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">要做什么</label>
                    <input type="text" id="f-title" placeholder="要做什么？" autocomplete="off">
                </div>
                <div class="form-row">
                    <label for="f-due" class="visually-hidden" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">截止日期</label>
                    <input type="date" id="f-due">
                    <label for="f-priority" class="visually-hidden" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">优先级</label>
                    <select id="f-priority">
                        <option value="低">低</option>
                        <option value="中" selected>中</option>
                        <option value="高">高</option>
                    </select>
                </div>
                <div class="row">
                    <button id="save-button-form" type="button">保存</button>
                </div>
            </div>

            <div class="hint">Esc 收起 · Enter 保存 · 右键更多</div>
        </div>
    </div>

    <script src="icons.js"></script>
    <script src="index.js"></script>
</body>
</html>
