<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>赛博秘书</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: transparent;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        }

        /* ---- 悬浮球 ---- */
        /* 外层：透明点击区，负责 hover/按下反馈（transform 不被动画占用） */
        #floating-ball {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            user-select: none;
            -webkit-app-region: no-drag;
            transition: transform 0.2s ease-out;
            touch-action: none;
        }
        #floating-ball:hover { transform: scale(1.08); }
        #floating-ball:active { transform: scale(0.94); }
        /* 内层：承载全部可视材质 + 呼吸/脉冲动画；透明背景时靠 box-shadow 形成点击区 */
        #ball-core {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            pointer-events: none;
            background: linear-gradient(135deg, rgba(120,130,150,0.92), rgba(80,88,104,0.92));
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25),
                        inset 0 1px 0 rgba(255,255,255,0.25);
            transition: background 0.5s ease, box-shadow 0.5s ease;
            will-change: transform;
        }
        /* 常驻呼吸动画（缩放内层材质） */
        #floating-ball.breathe #ball-core { animation: breathe 2.4s ease-in-out infinite; }
        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        /* 有截止提醒：常驻橙色呼吸（内层背景平滑过渡到橙色） */
        #floating-ball.due #ball-core {
            background: linear-gradient(135deg, rgba(255,160,60,0.95), rgba(230,110,40,0.95));
            animation: breathe 1.8s ease-in-out infinite;
        }
        /* 临近截止：红色急促脉冲 */
        #floating-ball.urgent #ball-core {
            background: linear-gradient(135deg, rgba(255,90,80,0.95), rgba(220,50,50,0.95));
            animation: pulse 1.2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,90,80,0.55); }
            50% { transform: scale(1.08); box-shadow: 0 0 0 10px rgba(255,90,80,0); }
        }

        /* 角标：待办数量 */
        #badge {
            position: absolute;
            top: -2px;
            right: -2px;
            min-width: 16px;
            height: 16px;
            padding: 0 4px;
            border-radius: 8px;
            background: #e5484d;
            color: white;
            font-size: 10px;
            font-weight: 700;
            display: none;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.6);
        }
        /* 保存成功：内层材质绿色闪光 */
        #floating-ball.saved #ball-core {
            background: linear-gradient(135deg, rgba(80,200,130,0.95), rgba(50,160,100,0.95));
            animation: flash-save 0.5s ease-out;
        }
        @keyframes flash-save {
            0% { transform: scale(0.6); opacity: 0.4; }
            30% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* ---- 输入面板 ---- */
        #input-container {
            display: none;
            width: 100%;
            height: 100%;
            padding: 8px;
        }
        #input-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: rgba(28, 28, 32, 0.9);
            backdrop-filter: blur(18px) saturate(160%);
            border-radius: 14px;
            padding: 10px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4),
                        inset 0 1px 0 rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.09);
            transform-origin: 50% 100%; /* 从底部(球的方向)展开 */
            opacity: 0;
            transform: scale(0.92);
            transition: opacity 0.18s ease-out, transform 0.22s cubic-bezier(0.2, 0.9, 0.3, 1.2), backdrop-filter 0.22s ease-out;
            will-change: transform, opacity;
        }
        #input-wrapper.show {
            opacity: 1;
            transform: scale(1);
            backdrop-filter: blur(18px) saturate(160%);
        }
        #text-input {
            flex: 1;
            width: 100%;
            border: none;
            background: rgba(255,255,255,0.08);
            color: white;
            padding: 0 12px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            margin-bottom: 8px;
        }
        #text-input::placeholder { color: rgba(255,255,255,0.45); }

        /* 保存失败内联提示 */
        #save-error {
            display: none;
            color: #ff8b8b;
            font-size: 11px;
            margin-top: 6px;
            padding: 5px 8px;
            border-radius: 6px;
            background: rgba(255,90,90,0.12);
        }

        .row { display: flex; gap: 6px; align-items: center; }
        .row select, .row input[type="date"] {
            background: rgba(255,255,255,0.1);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 5px 8px;
            font-size: 12px;
            outline: none;
            color-scheme: dark;
        }
        .row input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8); }
        .row label { color: rgba(255,255,255,0.5); font-size: 11px; }

        #save-button {
            height: 30px;
            padding: 0 16px;
            background: linear-gradient(135deg, rgba(120,130,150,0.9), rgba(80,88,104,0.9));
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: filter 0.2s;
            margin-left: auto;
        }
        #save-button:hover { filter: brightness(1.15); }

        /* AI 解析结果预览 */
        #ai-preview {
            display: none;
            background: rgba(120,180,255,0.1);
            border: 1px solid rgba(120,180,255,0.25);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 12px;
            color: rgba(255,255,255,0.85);
            margin-bottom: 8px;
            line-height: 1.5;
        }
        #ai-preview .ai-title { font-weight: 600; }
        #ai-preview .ai-edit {
            float: right;
            background: none;
            border: none;
            color: rgba(120,180,255,0.9);
            cursor: pointer;
            font-size: 11px;
        }

        /* 模式切换 Tab */
        .tabs { display: flex; gap: 4px; margin-bottom: 8px; }
        .tab {
            padding: 3px 10px;
            font-size: 11px;
            border-radius: 20px;
            background: rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.55);
            border: none;
            cursor: pointer;
        }
        .tab.active { background: rgba(120,180,255,0.25); color: white; }

        .form-row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
        .form-row input[type="text"], .form-row input[type="date"] {
            flex: 1;
            background: rgba(255,255,255,0.08);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 12px;
            outline: none;
        }
        .form-row select {
            background: rgba(255,255,255,0.1);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 12px;
        }
        #overlay { position: fixed; inset: 0; background: transparent; display: none; z-index: -1; }

        .hint { color: rgba(255,255,255,0.35); font-size: 10px; margin-top: 6px; text-align: center; }
    </style>
</head>
<body>
    <div id="floating-ball" title="双击输入">
        <div id="ball-core"></div>
        <span id="ball-icon" style="position:relative;color:white;font-size:18px;pointer-events:none;">◆</span>
        <span id="badge">0</span>
    </div>

    <div id="input-container">
        <div id="input-wrapper">
            <div class="tabs">
                <button class="tab active" id="tab-quick" data-mode="quick">快速记录</button>
                <button class="tab" id="tab-form" data-mode="form">结构化</button>
            </div>

            <!-- 快速记录模式 -->
            <div id="quick-panel">
                <div id="ai-preview"></div>
                <input type="text" id="text-input" placeholder="随手记，AI 会自动识别截止日期 #标签" autocomplete="off">
                <div class="row">
                    <button id="save-button">保存</button>
                </div>
                <div id="save-error">保存失败，请重试</div>
            </div>

            <!-- 结构化表单模式 -->
            <div id="form-panel" style="display:none;">
                <div class="form-row">
                    <input type="text" id="f-title" placeholder="要做什么？" autocomplete="off">
                </div>
                <div class="form-row">
                    <input type="date" id="f-due">
                    <select id="f-priority">
                        <option value="低">低</option>
                        <option value="中" selected>中</option>
                        <option value="高">高</option>
                    </select>
                </div>
                <div class="row">
                    <button id="save-button-form" style="margin-left:auto;">保存</button>
                </div>
            </div>

            <div class="hint">Esc 收起 · Enter 保存 · 右键更多</div>
        </div>
    </div>
    <div id="overlay"></div>

    <script>
        // 注意：不要用 const api = window.api 重新声明！
        // contextBridge.exposeInMainWorld('api', ...) 已在全局创建 api，
        // 重复 const 声明会抛 "Identifier 'api' has already been declared" 导致整个脚本不执行。
        // 直接通过全局标识符 api 访问。
        const ball = document.getElementById('floating-ball');
        const badge = document.getElementById('badge');
        const inputContainer = document.getElementById('input-container');
        const quickPanel = document.getElementById('quick-panel');
        const formPanel = document.getElementById('form-panel');
        const textInput = document.getElementById('text-input');
        const saveButton = document.getElementById('save-button');
        const saveButtonForm = document.getElementById('save-button-form');
        const aiPreview = document.getElementById('ai-preview');
        const saveError = document.getElementById('save-error');
        const overlay = document.getElementById('overlay');

        let currentMode = 'ball';
        let entryMode = 'quick';
        let pendingAiPreview = null; // AI 解析结果，用户确认后保存

        // 初始化
        inputContainer.style.display = 'none';
        ball.style.display = 'flex';
        ball.classList.add('breathe'); // 常驻呼吸动画

        // Tab 切换
        document.getElementById('tab-quick').addEventListener('click', () => setEntryMode('quick'));
        document.getElementById('tab-form').addEventListener('click', () => setEntryMode('form'));
        function setEntryMode(mode) {
            entryMode = mode;
            document.getElementById('tab-quick').classList.toggle('active', mode === 'quick');
            document.getElementById('tab-form').classList.toggle('active', mode === 'form');
            quickPanel.style.display = mode === 'quick' ? 'block' : 'none';
            formPanel.style.display = mode === 'form' ? 'block' : 'none';
            if (mode === 'quick') textInput.focus();
            else document.getElementById('f-title').focus();
        }

        // 双击进入输入模式（阈值判定：拖拽距离超过 5px 不视为双击）
        let lastClickTime = 0, lastClickX = 0, lastClickY = 0;
        ball.addEventListener('click', (e) => {
            if (currentMode !== 'ball') return;
            const now = Date.now();
            const moved = Math.hypot(e.clientX - lastClickX, e.clientY - lastClickY);
            if (now - lastClickTime < 350 && moved < 6) {
                switchToInputMode();
                lastClickTime = 0;
            } else {
                lastClickTime = now;
                lastClickX = e.clientX;
                lastClickY = e.clientY;
            }
        });

        // ---- 通用指针拖拽（Pointer Events + setPointerCapture）----
        // 指针捕获后，即使光标移出窗口，move/up 事件也持续发给目标元素，
        // 彻底解决小窗口拖拽过程中事件丢失的问题。
        function setupDrag(elm, onStart, onMove, onEnd) {
            let dragging = false;
            let startPX = 0, startPY = 0;

            elm.addEventListener('pointerdown', (e) => {
                if (e.button !== 0) return; // 只响应左键
                dragging = true;
                startPX = e.screenX;
                startPY = e.screenY;
                try { elm.setPointerCapture(e.pointerId); } catch (_) {}
                if (onStart) onStart();
            });

            elm.addEventListener('pointermove', (e) => {
                if (!dragging) return;
                const dx = e.screenX - startPX;
                const dy = e.screenY - startPY;
                // 位移超过阈值才算拖动，避免轻微抖动触发（Apple 建议 ~10px 滞回）
                if (onMove && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) {
                    if (onMove(dx, dy) === false) return; // 回调返回 false 表示不消费
                }
            });

            const endDrag = (e) => {
                if (!dragging) return;
                dragging = false;
                try { elm.releasePointerCapture(e.pointerId); } catch (_) {}
                if (onEnd) onEnd();
            };
            elm.addEventListener('pointerup', endDrag);
            elm.addEventListener('pointercancel', endDrag);
        }

        // 悬浮球拖拽
        setupDrag(ball,
            () => api.dragStart(),
            (dx, dy) => { api.dragMove(dx, dy); },
            () => api.dragEnd()
        );

        // 右键菜单
        ball.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            api.showBallMenu(e.clientX, e.clientY);
        });

        // Esc 返回小球
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && currentMode === 'input') switchToBallMode();
        });

        // 输入面板拖拽（排除输入控件）
        setupDrag(inputContainer,
            () => api.dragStart(),
            (dx, dy) => { api.dragMove(dx, dy); },
            () => api.dragEnd()
        );
        // 输入面板只在空白区域开始拖拽
        inputContainer.addEventListener('pointerdown', (e) => {
            const tag = e.target.tagName;
            if (tag === 'INPUT' || tag === 'SELECT' || tag === 'BUTTON' || tag === 'TEXTAREA') {
                e.stopPropagation();
            }
        }, true);

        // 快速记录：输入时实时 AI 预览（防抖 300ms）
        let aiTimer = null;
        textInput.addEventListener('input', () => {
            clearTimeout(aiTimer);
            const text = textInput.value.trim();
            if (!text) { aiPreview.style.display = 'none'; pendingAiPreview = null; return; }
            aiTimer = setTimeout(() => {
                // 调主进程做 AI 解析预览
                api.saveEntryPreview && api.saveEntryPreview(text);
            }, 300);
        });
        api.onAiPreview && api.onAiPreview((preview) => {
            if (!preview) return;
            pendingAiPreview = preview;
            aiPreview.innerHTML = '';
            const title = document.createElement('div');
            title.className = 'ai-title';
            title.textContent = (preview.type === 'task' ? '📌 ' : '📝 ') + (preview.title || '');
            const meta = document.createElement('div');
            meta.textContent = [preview.dueDate ? ('截止 ' + preview.dueDate) : '', preview.priority ? '优先级·' + preview.priority : '', preview.category ? preview.category : ''].filter(Boolean).join(' · ');
            aiPreview.appendChild(title);
            if (meta.textContent) aiPreview.appendChild(meta);
            aiPreview.style.display = 'block';
        });

        // 保存（快速记录）
        saveButton.addEventListener('click', saveQuick);
        textInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') saveQuick(); });
        function saveQuick() {
            const text = textInput.value.trim();
            if (!text) return;
            hideSaveError();
            api.saveEntry(text);
            textInput.value = '';
            aiPreview.style.display = 'none';
            pendingAiPreview = null;
            switchToBallMode();
        }

        // 保存（结构化表单）
        saveButtonForm.addEventListener('click', saveForm);
        function saveForm() {
            const title = document.getElementById('f-title').value.trim();
            const due = document.getElementById('f-due').value;
            const priority = document.getElementById('f-priority').value;
            if (!title) { document.getElementById('f-title').focus(); return; }
            hideSaveError();
            let payload = title;
            if (due) payload += ' 截止' + due;
            payload += ' 优先级' + priority;
            api.saveEntry(payload);
            document.getElementById('f-title').value = '';
            document.getElementById('f-due').value = '';
            switchToBallMode();
        }

        // 保存结果
        api.onSaveSuccess((data) => {
            if (!data || !data.ok) {
                showSaveError();
                return;
            }
            // 保存成功：球打勾闪光反馈
            showSaveSuccess();
        });

        function showSaveSuccess() {
            ball.classList.add('saved');
            const icon = document.getElementById('ball-icon');
            icon.textContent = '✓';
            setTimeout(() => {
                ball.classList.remove('saved');
                icon.textContent = '◆';
            }, 650);
        }
        function showSaveError() {
            saveError.style.display = 'block';
            setTimeout(hideSaveError, 2500);
        }
        function hideSaveError() {
            saveError.style.display = 'none';
        }

        api.onAiRefined((entry) => {
            if (entry && entry.status === 'pending') updateBallStatus(true);
        });

        // 提醒状态（主进程推送）
        api.onReminderAlert((data) => {
            if (data && data.hasDue) updateBallStatus(true);
        });

        function updateBallStatus(hasDue) {
            ball.classList.add('due');
            badge.style.display = 'flex';
        }

        // 模式切换
        function switchToInputMode() {
            currentMode = 'input';
            ball.classList.remove('breathe', 'due', 'urgent');
            ball.style.transform = 'scale(0)';
            ball.style.opacity = '0';
            api.resizeWindow('input');
            // 面板材质化进入
            const wrapper = document.getElementById('input-wrapper');
            wrapper.classList.remove('show');
            void wrapper.offsetWidth; // 强制回流，重置过渡起点
            inputContainer.style.display = 'flex';
            requestAnimationFrame(() => requestAnimationFrame(() => {
                wrapper.classList.add('show');
            }));
            setEntryMode(entryMode);
            setTimeout(() => {
                if (entryMode === 'quick') textInput.focus();
                else document.getElementById('f-title').focus();
            }, 160);
        }
        function switchToBallMode() {
            currentMode = 'ball';
            const wrapper = document.getElementById('input-wrapper');
            wrapper.classList.remove('show'); // 先淡出，再切回球
            setTimeout(() => {
                if (currentMode !== 'ball') return;
                inputContainer.style.display = 'none';
                api.resizeWindow('ball');
                ball.style.display = 'flex';
                // 球 pop 出现
                ball.style.transform = 'scale(0.8)';
                ball.style.opacity = '0';
                requestAnimationFrame(() => requestAnimationFrame(() => {
                    ball.style.transform = '';
                    ball.style.opacity = '';
                }));
                ball.classList.add('breathe');
            }, 180);
        }
    </script>
</body>
</html>
